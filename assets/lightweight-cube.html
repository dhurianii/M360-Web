<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moneylizer – 3D Cube</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  /* ─── Reset & Base ────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --accent3: #ff6b6b;
    --accent4: #ffd166;
    --face-bg: #f5f3ed;
    --face-border: #bbb5a8;
    --text: #29272f;
    --muted: #716e76;
    --size: 320px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ─── Scene ────────────────────────────────────────────────────── */
  #scene {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    perspective: 900px;
    perspective-origin: 50% 50%;
  }

  /* A soft ground shadow adds depth without any costly 3D lighting. */
  #cube-shadow {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--size) / 2 + 36px);
    width: var(--size);
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(45, 40, 34, 0.25) 0%, rgba(45, 40, 34, 0.1) 45%, transparent 72%);
    filter: blur(9px);
    transform: translateX(-50%) scaleX(1);
    transform-origin: center;
    animation: shadow-breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shadow-breathe {
    0%, 100% { opacity: 0.72; transform: translateX(-50%) scaleX(1); }
    50%      { opacity: 0.42; transform: translateX(-50%) scaleX(0.82); }
  }

  #float-wrap {
    animation: float 6s ease-in-out infinite;
    transform-style: preserve-3d;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-18px); }
  }

  /* ─── Cube ─────────────────────────────────────────────────────── */
  #cube {
    width:  var(--size);
    height: var(--size);
    transform-style: preserve-3d;
    /* auto-spin set via JS */
    cursor: grab;
    touch-action: none;
  }
  #cube.dragging { cursor: grabbing; }

  /* ─── Faces ──────────────────────────────────────────────────────
     FLAT/SHARP CORNERS: border-radius removed.
     Counter-rotation on .face-inner keeps text upright on
     top/bottom/left/right faces. The face containers are still
     rotated by the 3D transform, but the inner content is
     transformed back so it remains readable. */
  .face {
    position: absolute;
    width:  var(--size);
    height: var(--size);
    background: var(--face-bg);
    border: 1.5px solid var(--face-border);
    border-radius: 0;                 /* SHARP CORNERS — was 18px */
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      0 4px 12px rgba(48, 43, 34, 0.12),
      0 20px 48px rgba(48, 43, 34, 0.14);
  }

  /* Inner wrapper — un-rotates the face so text reads upright.
     Each face's .face-inner has its transform set dynamically by JS
     so that the content always faces the viewer (no upside-down
     or mirrored text) regardless of cube rotation. */
  .face-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    transform-style: preserve-3d;
  }

  .face-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* face transforms — OUTER face still gets the cube-rotation,
     but the inner wrapper applies a counter-rotation so the
     content reads right-side-up. The face stays a "front" of
     the cube (no mirror / upside-down) at any auto-spin angle. */
  .face-front  { transform: translateZ(calc(var(--size)/2)); }
  .face-back   { transform: rotateY(180deg) translateZ(calc(var(--size)/2)); }
  .face-right  { transform: rotateY(90deg)  translateZ(calc(var(--size)/2)); }
  .face-left   { transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); }
  .face-top    { transform: rotateX(90deg)  translateZ(calc(var(--size)/2)); }
  .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--size)/2)); }

  /* counter-rotation for each face's content is set dynamically
     by JS each frame so the text is always upright (no upside-
     down / mirrored text) regardless of the cube's rotation.
     The .face-front-inner etc. classes are no-ops here. */
  .face-front-inner,
  .face-back-inner,
  .face-right-inner,
  .face-left-inner,
  .face-top-inner,
  .face-bottom-inner { /* dynamic transform set by JS */ }

  /* ─── Hint ─────────────────────────────────────────────────────── */
  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.08em;
    opacity: 0.7;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ══════════════════════════════════════════════════════════════════
     GRAPH STYLES
  ══════════════════════════════════════════════════════════════════ */

  /* shared canvas wrapper */
  .chart-wrap {
    width: 100%; flex: 1;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .chart-wrap canvas {
    display: block;
    transform-origin: center;
    animation: graph-drift 4.8s ease-in-out infinite;
    will-change: transform;
  }
  #area-face canvas  { animation-delay: -1.2s; }
  #bar-face canvas   { animation-delay: -2.4s; }
  #line-face canvas  { animation-delay: -3.2s; }
  #radar-face canvas { animation-delay: -4s; }

  @keyframes graph-drift {
    0%, 100% { transform: translate3d(0, 2px, 0) scale(0.992); }
    50%      { transform: translate3d(0, -3px, 0) scale(1.012); }
  }

  /* ─── FACE 1 – SANKEY – consistent annual financial story ─────── */
  #sankey-face .sankey-img-wrap {
    width: 100%; flex: 1;
    position: relative;
    overflow: hidden;             /* sharp corners */
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 15% 20%, #efebff 0%, transparent 42%),
      radial-gradient(110% 85% at 85% 80%, #eef5ff 0%, transparent 44%),
      linear-gradient(180deg, #fdfcff 0%, #f9f8ff 100%);
  }
  #sankey-face .sankey-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }
  /* shimmer pulse on the sankey image */
  #sankey-face .sankey-shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(
      105deg,
      transparent 40%,
      rgba(108,99,255,0.12) 50%,
      transparent 60%
    );
    background-size: 200% 100%;
    animation: shimmer 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* sankey SVG fallback */
  #sankey-svg { width: 100%; height: 100%; }

  /* ─── Tooltip ──────────────────────────────────────────────────── */
  .chart-tooltip {
    position: fixed;
    background: rgba(245,243,237,0.96);
    border: 1px solid var(--face-border);
    color: var(--text);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    white-space: nowrap;
  }
  .chart-tooltip.visible { opacity: 1; }

  /* ─── Title tag ────────────────────────────────────────────────── */
  #title-tag {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #57535c;
    pointer-events: none;
  }
  #title-tag .t-icon {
    color: var(--accent);
    font-size: 16px;
    animation: icon-pulse 3s ease-in-out infinite;
  }
  @keyframes icon-pulse {
    0%,100% { opacity:0.7; transform: scale(1);   }
    50%      { opacity:1;   transform: scale(1.18); }
  }

  /* ─── BG ambient glow ──────────────────────────────────────────── */
  #bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    display: none;
  }

  /* ─── BG dot grid ───────────────────────────────────────────────── */
  #bg-grid {
    position: fixed; inset: 0; pointer-events: none;
    display: none;
  }

  /* ─── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 400px) {
    :root { --size: 240px; }
    #hint { bottom: 78px; }
  }
  @media (min-width: 401px) and (max-width: 600px) {
    :root { --size: 280px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #cube-shadow, .chart-wrap canvas { animation: none; }
  }
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════════
   CUBE CONTROLLER
   – CSS 3D transform based; zero external dependencies
   – Auto-rotate + float + drag + mouse parallax + wheel/pinch zoom
════════════════════════════════════════════════════════════════════ */
(function CubeController() {
  const cube = document.getElementById('cube');
  const floatWrap = document.getElementById('float-wrap');
  const scene = document.getElementById('scene');

  let rotX = -20, rotY = 25;        // initial angle
  let velX = 0,   velY = 0;
  let isDragging = false;
  let isPinching = false;
  let lastX = 0,  lastY = 0;
  let autoSpin = true;
  let resumeTimer = null;
  let rafId;
  let parallaxX = 0, parallaxY = 0;
  let zoom = 1, targetZoom = 1;
  let pinchStartDistance = 0, pinchStartZoom = 1;

  const AUTO_SPEED = 0.12;          // deg/frame
  const FRICTION   = 0.92;
  const PARALLAX_STRENGTH = 6;      // deg max
  const MIN_ZOOM = 0.68;
  const MAX_ZOOM = 1.4;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clampZoom(value) {
    return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));
  }

  function setZoom(value) {
    targetZoom = clampZoom(value);
  }

  function applyTransform(now = performance.now()) {
    // A tiny automatic scale pulse keeps the cube alive without adding GPU-heavy effects.
    const breathe = reduceMotion ? 1 : 1 + Math.sin(now * 0.001) * 0.022;
    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${zoom * breathe})`;
    // Keep each face's text upright regardless of cube rotation —
    // see applyCounterRotation() for the maths.
    applyCounterRotation();
  }

  /* Per-face counter-rotation so text never appears upside-down
     or mirrored as the cube spins.

     Effective orientation seen by the face-inner content is:
         R_cube * R_face * R_inner
     where R_cube = rotateX(rotX) rotateY(rotY)
           R_face = the face's static placement (translateZ + rotation)
           R_inner = whatever we set on .face-inner

     We want R_inner to cancel out everything so the content is
     upright, i.e. R_inner = (R_cube * R_face)^-1
                                = R_face^-1 * R_cube^-1
     The CSS transform list reads left-to-right but is applied
     right-to-left, so the inverse of `rotateX(a) rotateY(b)` is
     `rotateY(-b) rotateX(-a)`.

     R_face is a 3D placement:  translateZ(d) followed by a
     rotation.  R_face^-1 is the inverse rotation; translateZ is
     a pure translation, its inverse is a translateZ(-d), but
     since translateZ doesn't change orientation we can drop it
     from the inner transform — the face is already positioned
     in 3D by its outer transform.

     Per-face static inverse rotation:
        front  :  identity
        back   :  rotateY(180)   (its visible side is hidden by
                                   backface-visibility anyway)
        right  :  rotateY(-90)
        left   :  rotateY( 90)
        top    :  rotateX(-90)
        bottom :  rotateX( 90)
  */
  const faceInners = {
    front:  document.querySelector('#sankey-face .face-inner'),
    back:   document.querySelector('#donut-face  .face-inner'),
    right:  document.querySelector('#area-face   .face-inner'),
    left:   document.querySelector('#bar-face    .face-inner'),
    top:    document.querySelector('#line-face   .face-inner'),
    bottom: document.querySelector('#radar-face  .face-inner'),
  };
  const FACE_INV = {
    front:  '',
    back:   'rotateY(180deg) ',
    right:  'rotateY(-90deg) ',
    left:   'rotateY(90deg) ',
    top:    'rotateX(-90deg) ',
    bottom: 'rotateX(90deg) ',
  };

  function applyCounterRotation() {
    // inverse of cube's rotation, in CSS list order
    const invCube = `rotateY(${-rotY}deg) rotateX(${-rotX}deg) `;
    for (const key in faceInners) {
      const el = faceInners[key];
      if (!el) continue;
      el.style.transform = FACE_INV[key] + invCube;
    }
  }

  function tick(now) {
    zoom += (targetZoom - zoom) * 0.12;

    if (!isDragging) {
      if (autoSpin) {
        rotY += AUTO_SPEED;
      } else {
        rotY += velY;
        rotX += velX;
        velX *= FRICTION;
        velY *= FRICTION;
      }
      // clamp X gently
      rotX = Math.max(-60, Math.min(60, rotX));
    }

    // apply parallax to float-wrap (subtle)
    floatWrap.style.transform =
      `rotateX(${parallaxY * PARALLAX_STRENGTH * 0.3}deg) rotateY(${parallaxX * PARALLAX_STRENGTH * 0.3}deg)`;

    applyTransform(now);
    rafId = requestAnimationFrame(tick);
  }

  // ── Mouse drag ──────────────────────────────────────────────────
  function onPointerDown(e) {
    isDragging = true;
    autoSpin   = false;
    cube.classList.add('dragging');
    lastX = e.clientX || e.touches?.[0]?.clientX || 0;
    lastY = e.clientY || e.touches?.[0]?.clientY || 0;
    velX = velY = 0;
    clearTimeout(resumeTimer);
  }

  function onPointerMove(e) {
    if (!isDragging) {
      // parallax from mouse position
      const nx = (e.clientX / window.innerWidth  - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      parallaxX += (nx - parallaxX) * 0.05;
      parallaxY += (ny - parallaxY) * 0.05;
      return;
    }
    const cx = e.clientX || e.touches?.[0]?.clientX || lastX;
    const cy = e.clientY || e.touches?.[0]?.clientY || lastY;
    const dx = cx - lastX;
    const dy = cy - lastY;
    velY = dx * 0.35;
    velX = -dy * 0.35;
    rotY += velY;
    rotX += velX;
    lastX = cx; lastY = cy;
    applyTransform();
  }

  function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;
    cube.classList.remove('dragging');
    resumeTimer = setTimeout(() => { autoSpin = true; velX = velY = 0; }, 2200);
  }

  function touchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  // Events
  cube.addEventListener('mousedown',   onPointerDown, { passive: true });
  window.addEventListener('mousemove', onPointerMove, { passive: true });
  window.addEventListener('mouseup',   onPointerUp);

  scene.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(targetZoom * Math.exp(-e.deltaY * 0.0012));
  }, { passive: false });

  cube.addEventListener('dblclick', () => setZoom(1));

  cube.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      isPinching = true;
      isDragging = false;
      autoSpin = false;
      cube.classList.add('dragging');
      clearTimeout(resumeTimer);
      pinchStartDistance = touchDistance(e.touches);
      pinchStartZoom = targetZoom;
      return;
    }
    onPointerDown(e.touches[0]);
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (isPinching && e.touches.length >= 2) {
      e.preventDefault();
      setZoom(pinchStartZoom * (touchDistance(e.touches) / pinchStartDistance));
    } else if (isDragging && e.touches.length === 1) {
      e.preventDefault();
      onPointerMove(e.touches[0]);
    }
  }, { passive: false });
  window.addEventListener('touchend', e => {
    if (isPinching && e.touches.length < 2) {
      isPinching = false;
      cube.classList.remove('dragging');
      resumeTimer = setTimeout(() => { autoSpin = true; }, 1800);
      return;
    }
    onPointerUp();
  });

  tick();
})();


/* ════════════════════════════════════════════════════════════════════
   CHART UTILITIES + SHARED DATASET
   Annual story (FY 2025-26):
     Salary:      ₹18L       Food:      ₹1.56L
     Other Inc:   ₹47.2K     Travel:    ₹4.08L
     Total In:    ₹18.47L    Shopping:  ₹3.56L
                            Health:     ₹3.29L
     Savings:     ₹12L       Subs:      ₹0.88L
                            Others:     ₹1.80L
                            Total Out:  ₹21.07L
     Balance:     ₹8.4L (debt)
════════════════════════════════════════════════════════════════════ */
const C = {
  accent:  '#6c63ff',
  accent2: '#00d4aa',
  accent3: '#ff6b6b',
  accent4: '#ffd166',
  accent5: '#74b9ff',
  bg:      'rgba(245,243,237,0.0)',
  text:    '#29272f',
  muted:   '#716e76',
  grid:    'rgba(52,48,57,0.11)',
};

function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* Indian number formatting: 1234567 → ₹12.34L, 10000000 → ₹1Cr */
function inrShort(n) {
  if (n >= 1e7) return `₹${(n/1e7).toFixed(n % 1e7 === 0 ? 0 : 2)}Cr`;
  if (n >= 1e5) return `₹${(n/1e5).toFixed(n % 1e5 === 0 ? 0 : 2)}L`;
  if (n >= 1e3) return `₹${(n/1e3).toFixed(n % 1e3 === 0 ? 0 : 1)}K`;
  return `₹${n}`;
}

/* animated progress 0→1 */
function animateDraw(duration, onFrame, onDone) {
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOut
    onFrame(ease);
    if (t < 1) requestAnimationFrame(step);
    else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}

/* ════════════════════════════════════════════════════════════════════
   FACE 2 – DONUT CHART (ALLOCATION)
   ₹12L portfolio split: 42% Stocks, 25% Bonds, 18% Crypto, 15% Cash
════════════════════════════════════════════════════════════════════ */
(function DonutChart() {
  const canvas = document.getElementById('donut-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Percentages and underlying ₹ values (sum to ₹12L = ₹12,00,000)
  const data = [
    { label: 'Stocks',  pct: 42, value: 504000, color: C.accent  }, // ₹5.04L
    { label: 'Bonds',   pct: 25, value: 300000, color: C.accent2 }, // ₹3.00L
    { label: 'Crypto',  pct: 18, value: 216000, color: C.accent3 }, // ₹2.16L
    { label: 'Cash',    pct: 15, value: 180000, color: C.accent4 }, // ₹1.80L
  ];
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx = W/2, cy = H/2 - 10;
  const outerR = Math.min(W,H)*0.36;
  const innerR = outerR * 0.56;
  const GAP = 0.025; // rad gap between slices

  let progress = 0;
  let hoveredIdx = -1;
  let pulseT = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    let startAngle = -Math.PI/2;
    const slices = data.map(d => {
      const sweep = (d.value/total) * Math.PI * 2 * p;
      return { ...d, startAngle, sweep };
      startAngle += sweep + GAP;
    });
    let angle = -Math.PI/2;
    slices.forEach((s,i) => {
      s.startAngle = angle;
      s.sweep = (data[i].value/total) * (Math.PI*2 - GAP*data.length) * p;
      angle += s.sweep + GAP;
    });

    slices.forEach((s, i) => {
      const hovered = i === hoveredIdx;
      const idlePulse = 1 + Math.sin(pulseT + i * 0.9) * 0.015;
      const pulse = idlePulse * (hovered ? 1 + Math.sin(pulseT) * 0.015 : 1);
      const oR = outerR * pulse + (hovered ? 8 : 0);
      const iR = innerR;

      if (hovered) {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = s.color;
      }

      ctx.beginPath();
      ctx.arc(cx, cy, oR, s.startAngle, s.startAngle + s.sweep);
      ctx.arc(cx, cy, iR, s.startAngle + s.sweep, s.startAngle, true);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.globalAlpha = hovered ? 1 : 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (hovered) ctx.restore();
    });

    // center text — total portfolio (in ₹)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.text;
    ctx.font = `bold 22px system-ui`;
    ctx.fillText('₹12L', cx, cy - 6);
    ctx.fillStyle = C.muted;
    ctx.font = `10px system-ui`;
    ctx.fillText('Total Portfolio', cx, cy + 14);

    // legend
    const legendY = cy + outerR + 14;
    const colW = W / data.length;
    data.forEach((d,i) => {
      const lx = colW * i + colW/2;
      ctx.fillStyle = d.color;
      ctx.fillRect(lx - 18, legendY, 10, 10);
      ctx.fillStyle = C.muted;
      ctx.font = '8.5px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(d.label, lx - 5, legendY + 8);
    });
  }

  function idleTick() {
    pulseT += 0.04;
    draw(1);
    requestAnimationFrame(idleTick);
  }

  animateDraw(1100, p => { progress = p; draw(p); }, idleTick);
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 3 – AREA CHART (MONTHLY SPENDING TREND, FY 2025-26)
   Monthly expenses that sum to ₹21.07L over 12 months
   Range ₹1.4L – ₹2.2L per month
════════════════════════════════════════════════════════════════════ */
(function AreaChart() {
  const canvas = document.getElementById('area-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Monthly spend (in ₹ Lakhs).  Sum = 21.07L
  const months  = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  // FY 2025-26: in lakhs
  const values  = [1.65, 1.78, 1.62, 1.70, 1.85, 1.55, 1.92, 1.74, 1.88, 1.66, 1.79, 1.93];
  const PAD = { t:20, r:14, b:28, l:42 };
  const W2 = W - PAD.l - PAD.r;
  const H2 = H - PAD.t - PAD.b;

  const minV = 1.4, maxV = 2.2;     // in Lakhs
  function px(i)  { return PAD.l + (i/(values.length-1))*W2; }
  function py(v)  { return PAD.t + H2 - ((v-minV)/(maxV-minV))*H2; }

  let shimX = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid lines + ₹L labels
    [1.6, 1.8, 2.0, 2.2].forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y);
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = C.muted; ctx.font = '8px system-ui';
      ctx.textAlign = 'right';
      ctx.fillText(`₹${v.toFixed(1)}L`, PAD.l - 3, y + 3);
    });

    // build points up to progress
    const pts = [];
    const count = Math.max(2, Math.round(p * values.length));
    for (let i=0; i<count; i++) {
      const frac = Math.min(1, p * values.length - (i - 1));
      const v = i < count-1 ? values[i] : lerp(values[Math.max(0,i-1)], values[i], frac);
      pts.push([px(i), py(v)]);
    }

    if (pts.length < 2) return;

    // gradient fill
    const grad = ctx.createLinearGradient(0, PAD.t, 0, H - PAD.b);
    grad.addColorStop(0,   hexToRgba(C.accent, 0.45));
    grad.addColorStop(0.6, hexToRgba(C.accent, 0.12));
    grad.addColorStop(1,   hexToRgba(C.accent, 0.0));

    ctx.beginPath();
    ctx.moveTo(pts[0][0], H - PAD.b);
    ctx.lineTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length; i++) {
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      const cx0 = x0+(x1-x0)*0.5, cx1 = x1-(x1-x0)*0.5;
      ctx.bezierCurveTo(cx0, y0, cx1, y1, x1, y1);
    }
    ctx.lineTo(pts[pts.length-1][0], H - PAD.b);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line stroke
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length; i++) {
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      const cx0 = x0+(x1-x0)*0.5, cx1 = x1-(x1-x0)*0.5;
      ctx.bezierCurveTo(cx0, y0, cx1, y1, x1, y1);
    }
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();

    // dots
    pts.forEach(([x,y], i) => {
      ctx.beginPath();
      ctx.arc(x, y, 2.5 + Math.sin(shimX * 0.04 + i * 0.75) * 0.65, 0, Math.PI*2);
      ctx.fillStyle = C.accent; ctx.fill();
    });

    // shimmer line
    const sx = PAD.l + ((shimX % (W2 + 60)) - 30);
    const shimGrad = ctx.createLinearGradient(sx-15, 0, sx+15, 0);
    shimGrad.addColorStop(0,   'transparent');
    shimGrad.addColorStop(0.5, 'rgba(108,99,255,0.35)');
    shimGrad.addColorStop(1,   'transparent');
    ctx.fillStyle = shimGrad;
    ctx.fillRect(sx-15, PAD.t, 30, H2);

    // x labels
    ctx.fillStyle = C.muted; ctx.font = '7.5px system-ui'; ctx.textAlign = 'center';
    months.forEach((m,i) => {
      if (i % 2 === 0) ctx.fillText(m, px(i), H - 4);
    });
  }

  animateDraw(1200, p => draw(p), () => {
    function shimTick() {
      shimX += 1.5;
      draw(1);
      requestAnimationFrame(shimTick);
    }
    shimTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 4 – MULTI-BAR CHART (HALF-YEAR INCOME vs EXPENSES)
   6-month view. Income × 6 ≈ ₹9L (half of ₹18L salary).
   Expenses × 6 ≈ ₹10.5L (half of ₹21.07L).
════════════════════════════════════════════════════════════════════ */
(function BarChart() {
  const canvas = document.getElementById('bar-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // H1 of FY 2025-26 (Apr–Sep). Income + Other-income averaged.
  // Income (₹)   : 1.50L, 1.55L, 1.45L, 1.50L, 1.60L, 1.55L   →  sum ₹9.15L
  // Expenses (₹) : 1.65L, 1.78L, 1.62L, 1.70L, 1.85L, 1.55L   →  sum ₹10.15L
  const cats    = ['Apr','May','Jun','Jul','Aug','Sep'];
  const income  = [150000, 155000, 145000, 150000, 160000, 155000];
  const expense = [165000, 178000, 162000, 170000, 185000, 155000];
  const PAD = { t:20, r:14, b:28, l:42 };
  const W2 = W - PAD.l - PAD.r;
  const H2 = H - PAD.t - PAD.b;
  const maxV = 200000;             // ₹2L ceiling (axis in ₹)
  const groupW = W2 / cats.length;
  const barW   = groupW * 0.3;

  function py(v) { return PAD.t + H2 - (v/maxV)*H2; }
  function ph(v) { return (v/maxV)*H2; }

  let pulseT = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid (₹ in Lakhs) — 4 ticks
    [50000, 100000, 150000, 200000].forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y);
      ctx.strokeStyle = C.grid; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=C.muted; ctx.font='8px system-ui'; ctx.textAlign='right';
      ctx.fillText(`₹${(v/100000).toFixed(1)}L`, PAD.l-3, y+3);
    });

    cats.forEach((cat,i) => {
      const gx = PAD.l + i*groupW + groupW*0.1;
      const pulse = 1 + Math.sin(pulseT + i*0.8)*0.026;

      // Income bar
      const ih = ph(income[i]*p) * pulse;
      const ig = ctx.createLinearGradient(0, py(income[i]*p), 0, py(0));
      ig.addColorStop(0, hexToRgba(C.accent2, 0.95));
      ig.addColorStop(1, hexToRgba(C.accent2, 0.5));
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.roundRect(gx, H-PAD.b - ih, barW, ih, [3,3,0,0]);
      ctx.fill();

      // Expense bar
      const eh = ph(expense[i]*p) * pulse;
      const eg = ctx.createLinearGradient(0, py(expense[i]*p), 0, py(0));
      eg.addColorStop(0, hexToRgba(C.accent3, 0.95));
      eg.addColorStop(1, hexToRgba(C.accent3, 0.5));
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.roundRect(gx + barW + 3, H-PAD.b - eh, barW, eh, [3,3,0,0]);
      ctx.fill();

      // label
      ctx.fillStyle = C.muted; ctx.font='8px system-ui'; ctx.textAlign='center';
      ctx.fillText(cat, gx + barW + 1.5, H - 6);
    });

    // legend
    ctx.fillStyle = C.accent2;
    ctx.fillRect(PAD.l, 5, 8, 8);
    ctx.fillStyle = C.muted; ctx.font='8px system-ui'; ctx.textAlign='left';
    ctx.fillText('Income', PAD.l+11, 13);
    ctx.fillStyle = C.accent3;
    ctx.fillRect(PAD.l+55, 5, 8, 8);
    ctx.fillStyle = C.muted;
    ctx.fillText('Expense', PAD.l+68, 13);
  }

  animateDraw(1100, p => draw(p), () => {
    function idleTick() {
      pulseT += 0.035;
      draw(1);
      requestAnimationFrame(idleTick);
    }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 5 – LINE CHART (TRACKING YOUR GOALS)
   6 quarters Q1..Q6. Y-axis in ₹20L increments: 20L, 40L, 60L, 80L, 1Cr.
   Two lines: Savings Target (solid) vs Actual (dashed).
   Subtle emoji markers for life goals.
════════════════════════════════════════════════════════════════════ */
(function LineChart() {
  const canvas = document.getElementById('line-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // 6 quarters Q1..Q6 — cumulative savings (₹).
  // Target grows linearly to ₹1.2Cr; actual tracks slightly below.
  const quarters = ['Q1','Q2','Q3','Q4','Q5','Q6'];
  // Target (₹): 0 → ₹1.2Cr in 6 quarters (₹20L/quarter steady pace)
  // Values are in raw rupees, NOT lakhs.
  const target  = [2000000, 4000000, 6000000, 8000000, 10000000, 12000000];
  // Actual: realistic story — slightly behind target.
  //   After 6 quarters actual is ₹1.04Cr (₹1.2Cr target — ₹8.4L of debt
  //   carried from the year reflected on the Sankey face).
  const actual  = [1800000, 3500000, 5200000, 7000000, 8800000, 10400000];

  // Goal markers (subtle emoji) on the target line at the quarter the
  // goal would be hit.  Only 3 markers, kept tiny and low-opacity so the
  // chart doesn't get cluttered.
  const goals = [
    { qIdx: 1, emoji: '🏠', label: 'Home'  },  // ₹40L down-payment goal
    { qIdx: 3, emoji: '🚗', label: 'Car'   },  // ₹80L
    { qIdx: 5, emoji: '✈️', label: 'Travel'},  // ₹1.2Cr
  ];

  const PAD   = { t:24, r:14, b:28, l:42 };
  const W2 = W-PAD.l-PAD.r, H2 = H-PAD.t-PAD.b;
  // Y-axis ₹20L increments up to ₹1.2Cr.  Show ₹20L, ₹40L, ₹60L,
  // ₹80L, ₹1Cr, ₹1.2Cr.
  const ticks = [2000000, 4000000, 6000000, 8000000, 10000000, 12000000];
  const minV=0, maxV=12000000;

  function px(i) { return PAD.l + (i/(quarters.length-1))*W2; }
  function py(v) { return PAD.t + H2 - ((v-minV)/(maxV-minV))*H2; }
  // Render an axis tick in the Indian money format
  function tickLabel(v) {
    if (v >= 1e7) return `₹${v/1e7 === Math.floor(v/1e7) ? v/1e7 : (v/1e7).toFixed(2)}Cr`;
    if (v >= 1e5) return `₹${v/1e5}L`;
    return `₹${v}`;
  }

  let dotT = 0;

  function drawLine(pts, color, dashed) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) {
      const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
      ctx.bezierCurveTo(x0+(x1-x0)*0.5,y0, x1-(x1-x0)*0.5,y1, x1,y1);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    if (dashed) {
      ctx.setLineDash([5,4]);
      ctx.lineDashOffset = -dotT * 7;
    } else {
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }

  function drawEmoji(x, y, emoji) {
    // subtle, small, low-opacity so it doesn't dominate the chart
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = '10px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, x, y);
    ctx.restore();
  }

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid
    ticks.forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y);
      ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=C.muted; ctx.font='8px system-ui'; ctx.textAlign='right';
      ctx.fillText(tickLabel(v), PAD.l-3, y+3);
    });

    const cnt = Math.max(2, Math.round(p*quarters.length));
    const tgtPts   = Array.from({length:cnt},(_,i)=>[px(i),py(target[i])]);
    const actPts   = Array.from({length:cnt},(_,i)=>[px(i),py(actual[i])]);

    drawLine(tgtPts,  C.accent,  false);
    drawLine(actPts,  C.accent4, true);

    // animated dots on last point
    const tPulse = 3 + Math.sin(dotT)*1.2;
    const aPulse = 3 + Math.sin(dotT+1)*1.2;
    if (tgtPts.length) {
      const [rx,ry]=tgtPts[tgtPts.length-1];
      ctx.beginPath(); ctx.arc(rx,ry,tPulse,0,Math.PI*2);
      ctx.fillStyle=C.accent; ctx.fill();
      ctx.beginPath(); ctx.arc(rx,ry,tPulse+3,0,Math.PI*2);
      ctx.strokeStyle=hexToRgba(C.accent,0.3); ctx.lineWidth=1.5; ctx.stroke();
    }
    if (actPts.length) {
      const [qx,qy]=actPts[actPts.length-1];
      ctx.beginPath(); ctx.arc(qx,qy,aPulse,0,Math.PI*2);
      ctx.fillStyle=C.accent4; ctx.fill();
    }

    // emoji goal markers — placed just above the target dot for that quarter
    goals.forEach(g => {
      if (g.qIdx < cnt) {
        const [gx, gy] = [px(g.qIdx), py(target[g.qIdx])];
        drawEmoji(gx, gy - 12, g.emoji);
      }
    });

    // x labels (Q1..Q6)
    ctx.fillStyle=C.muted; ctx.font='8px system-ui'; ctx.textAlign='center';
    quarters.forEach((q,i) => ctx.fillText(q, px(i), H - 4));

    // legend
    ctx.fillStyle=C.accent; ctx.fillRect(PAD.l,5,12,3);
    ctx.fillStyle=C.muted;  ctx.font='8px system-ui'; ctx.textAlign='left';
    ctx.fillText('Target', PAD.l+15, 13);
    ctx.strokeStyle=C.accent4; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l+55,7); ctx.lineTo(PAD.l+67,7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=C.muted; ctx.fillText('Actual', PAD.l+70, 13);
  }

  animateDraw(1100, p => draw(p), () => {
    function idleTick() { dotT+=0.06; draw(1); requestAnimationFrame(idleTick); }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 6 – RADAR CHART (FINANCIAL HEALTH SCORE)
   Six dimensions scored out of 100.
     Savings    58  (low — ₹8.4L debt carried)
     Income     88  (steady ₹1.5L/mo)
     Invest     82  (₹12L portfolio built)
     Debt       46  (₹8.4L outstanding)
     Spending   62  (spending slightly above income)
     Emergency  54  (low cash buffer)
   Average ≈ 65 (mid-range; reflects the ₹8.4L debt on the Sankey)
════════════════════════════════════════════════════════════════════ */
(function RadarChart() {
  const canvas = document.getElementById('radar-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const labels = ['Savings','Income','Invest','Debt','Spending','Emergency'];
  const scores = [58, 88, 82, 46, 62, 54];
  const cx = W/2, cy = H/2 + 4;
  const maxR = Math.min(W,H)*0.33;
  const N = labels.length;

  let pulseT = 0;

  function angle(i) { return (i/N)*Math.PI*2 - Math.PI/2; }
  function point(i, r) {
    return [cx + Math.cos(angle(i))*r, cy + Math.sin(angle(i))*r];
  }

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid rings
    [0.25,0.5,0.75,1].forEach(frac => {
      ctx.beginPath();
      for (let i=0;i<N;i++) {
        const [x,y]=point(i,maxR*frac);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // spokes
    for (let i=0;i<N;i++) {
      const [x,y]=point(i,maxR);
      ctx.beginPath();
      ctx.moveTo(cx,cy); ctx.lineTo(x,y);
      ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.stroke();
    }

    // data polygon with pulse
    const pulse = 1 + Math.sin(pulseT)*0.03;
    ctx.beginPath();
    for (let i=0;i<N;i++) {
      const r = (scores[i]/100)*maxR*p*pulse;
      const [x,y] = point(i,r);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,maxR);
    grad.addColorStop(0, hexToRgba(C.accent,0.6));
    grad.addColorStop(1, hexToRgba(C.accent2,0.25));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    // dots on vertices
    for (let i=0;i<N;i++) {
      const r = (scores[i]/100)*maxR*p*pulse;
      const [x,y] = point(i,r);
      ctx.beginPath();
      ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle = C.accent2; ctx.fill();
      ctx.strokeStyle='rgba(0,212,170,0.4)'; ctx.lineWidth=2; ctx.stroke();
    }

    // labels
    for (let i=0;i<N;i++) {
      const [x,y]=point(i, maxR+16);
      ctx.fillStyle = C.text;
      ctx.font = '8.5px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labels[i], x, y);
    }

    // center score
    const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length * p);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=C.text; ctx.font='bold 16px system-ui';
    ctx.fillText(avg, cx, cy-5);
    ctx.fillStyle=C.muted; ctx.font='8px system-ui';
    ctx.fillText('avg score', cx, cy+10);
  }

  animateDraw(1200, p => draw(p), () => {
    function idleTick() { pulseT+=0.04; draw(1); requestAnimationFrame(idleTick); }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   SANKEY – user image injection helper
   Call window.setSankeyImage('your-image-url') from console or parent page
════════════════════════════════════════════════════════════════════ */
window.setSankeyImage = function(url) {
  const wrap = document.getElementById('sankey-wrap');
  const svg  = document.getElementById('sankey-svg');
  if (svg) svg.remove();
  const img = document.createElement('img');
  img.src = url;
  img.alt = 'Sankey Diagram';
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
  wrap.insertBefore(img, wrap.firstChild);
};
</script>
