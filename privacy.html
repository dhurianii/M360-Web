<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  /* Legal page iframe shell.
     - Full-width responsive container with horizontal padding that mirrors
       the rest of the site (px-5 sm:px-8).
     - The iframe is sized large enough to fit the full MegaGraphs doc without
       forcing an inner scrollbar at desktop widths; if the doc is longer, the
       iframe itself scrolls.
     - On mobile we keep the same height but tighten side padding so the
       content has room to render. */
  .legal-shell {
    width: 100%;
    margin: 0 auto;
    padding: 32px 20px 64px;
    box-sizing: border-box;
  }
  @media (min-width: 640px) {
    .legal-shell { padding: 40px 32px 80px; }
  }
  @media (min-width: 768px) {
    .legal-shell { padding: 48px 40px 96px; }
  }
  .legal-frame-wrap {
    width: 100%;
    max-width: 100%;
    background: #ffffff;
    border: 1px solid #e7ecf3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px -16px rgba(15, 23, 42, 0.10);
  }
  .legal-frame {
    display: block;
    width: 100%;
    height: 2400px;          /* generous enough for the full MegaGraphs doc */
    border: 0;
    background: #ffffff;
  }
  @media (max-width: 639.98px) {
    .legal-frame { height: 3000px; } /* mobile gets extra headroom */
  }
</style>
</head>
<body class="text-slate-900 antialiased">
<div class="ambient" aria-hidden="true"><div class="blue"></div><div class="green"></div></div>

<div id="site-header"></div>

<main class="legal-shell fade-up">
  <div class="legal-frame-wrap">
    <iframe
      class="legal-frame"
      src="assets/content/legal-privacy.html"
      title="Money360 Privacy Policy"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/partials.js"></script>
<script src="assets/js/nav.js"></script>
</body>
</html>
