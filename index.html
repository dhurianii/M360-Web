<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money360 — AI-Powered Financial Intelligence Platform</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/responsive.css">
  <style>
    /* carousel-only additions — kept here so style.css and the rest of the site stay untouched */
    /* Slide 3 — logo carousel */
    .logo-carousel {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center;
      padding: 12px 14px;           /* tighter padding on mobile */
      box-sizing: border-box;
      background: #ffffff;
    }
    @media (min-width: 640px) {
      .logo-carousel { padding: 16px 56px; }   /* room for circular arrows on tablet+ */
    }
    .logo-viewport {
      position: relative;
      flex: 1; height: 100%;
      overflow: hidden;
      /* peek of the next card on the right edge — signals "more content" */
      padding-right: 0;
    }
    @media (min-width: 640px) {
      .logo-viewport { padding-right: 40px; }
    }
    .logo-viewport::after {
      /* soft fade so the peeked card blends into the background */
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 30px;
      background: linear-gradient(to right, rgba(255,255,255,0), #ffffff 80%);
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .logo-viewport::after { width: 40px; }
    }
    .logo-track {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: 25%;      /* overridden by JS to (100/totalCols)% */
      gap: 0;                      /* visual spacing comes from card padding */
      height: 100%;
      width: 100%;                  /* overridden by JS */
      transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .logo-card {
      padding: 6px;
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      min-height: 0;
    }
    @media (min-width: 640px) {
      .logo-card { padding: 8px; }
    }
    .logo-card-inner {
      width: 100%; height: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;            /* subtle border */
      border-radius: 10px;                  /* rounded corners */
      box-shadow: 0 2px 8px rgba(15,23,42,0.06);  /* soft shadow */
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    @media (min-width: 640px) {
      .logo-card-inner { border-radius: 12px; padding: 14px; }
    }
    .logo-card-inner:hover {
      border-color: #c7d7f5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15,23,42,0.08);
    }
    .logo-card-inner svg,
    .logo-card-inner .logo-img {
      max-width: 80%; max-height: 80%;
      width: auto; height: auto;
    }
    .logo-card-inner .logo-img {
      object-fit: contain;
    }
    /* Arrows: inside the carousel on mobile (no side padding), outside on tablet+ */
    .logo-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px;
      border-radius: 9999px;        /* circle */
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(15,23,42,0.10);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #0f172a;
      transition: background .15s ease, transform .15s ease, opacity .2s ease;
      z-index: 2;
    }
    @media (min-width: 640px) {
      .logo-arrow { width: 38px; height: 38px; }
    }
    .logo-arrow:hover { background: #f8fafc; }
    .logo-arrow:active { transform: translateY(-50%) scale(0.96); }
    .logo-arrow:disabled { opacity: 0.35; cursor: default; }
    .logo-arrow.prev { left: 4px; }
    .logo-arrow.next { right: 4px; }
    @media (min-width: 640px) {
      .logo-arrow.prev { left: 8px; }
      .logo-arrow.next { right: 8px; }
    }
    .logo-arrow svg { width: 14px; height: 14px; }
    @media (min-width: 640px) {
      .logo-arrow svg { width: 16px; height: 16px; }
    }
    .viz-tab {
      font-size: 12px; font-weight: 600; color: #64748b;
      padding: 6px 12px; border-radius: 9999px;
      background: transparent; border: 1px solid transparent;
      cursor: pointer; transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .viz-tab:hover { color: #0f172a; }
    .viz-tab.active {
      color: #0f172a;
      background: #ffffff;
      border-color: #c7d7f5;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }

    /* ---------------------------------------------------------------------
       Slide 3 — Logo scoreboard (4 → 4 → 2).
       Four black tiles in a row, each holding a logo. Tiles flip up from
       the bottom with a left-to-right stagger (rotateX, ~80 ms apart).
       Phase dwell ~5 s; arrow buttons step phases manually.
       Layout: 4 columns, 3 rows; the 10th logo spans cols 2-3 of row 3
       so the 2-tile row stays centered under the 4-tile rows.
    --------------------------------------------------------------------- */
    .scoreboard {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      box-sizing: border-box;
      background: #ffffff;
      perspective: 1400px;
    }
    .scoreboard-stage {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scoreboard-grid {
      width: 100%;
      max-width: 1080px;
      display: grid;
      gap: clamp(10px, 1.4vw, 18px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto auto auto;
      align-items: stretch;
    }
    @media (max-width: 720px) {
      .scoreboard-grid { gap: 10px; }
    }

    /* Tile: black card with the logo centred inside, taller than wide
       (matches the reference "2023" tiles). */
    .score-cell {
      position: relative;
      aspect-ratio: 4 / 5;
      transform-style: preserve-3d;
      transform-origin: 50% 100%;
      /* Hidden by default — JS adds .is-in to play the entrance. */
      opacity: 0;
      transform: translateY(60%) rotateX(-90deg);
      will-change: transform, opacity;
    }
    .score-cell:nth-child(9) { grid-column: 2; }
    .score-cell:nth-child(10){ grid-column: 3; }
    @media (max-width: 720px) {
      .score-cell { aspect-ratio: 5 / 6; }
    }

    /* Entrance state. The keyframe is driven by --flip-delay, which JS
       sets per cell so the left-to-right cascade has the right offset. */
    .score-cell.is-in {
      animation: score-in 0.85s cubic-bezier(.18,.95,.32,1.05) both;
      animation-delay: var(--flip-delay, 0ms);
    }
    @keyframes score-in {
      0%   { opacity: 0; transform: translateY(60%) rotateX(-90deg); }
      55%  { opacity: 1; }
      100% { opacity: 1; transform: translateY(0)    rotateX(0deg);   }
    }

    /* Exit state — tiles drop back down so the next phase can come in. */
    .score-cell.is-out {
      animation: score-out 0.45s cubic-bezier(.4,0,.7,.3) both;
      animation-delay: var(--flip-delay, 0ms);
    }
    @keyframes score-out {
      0%   { opacity: 1; transform: translateY(0)    rotateX(0deg);   }
      100% { opacity: 0; transform: translateY(40%) rotateX(45deg);  }
    }

    .score-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14% 16%;
      box-sizing: border-box;
      box-shadow: 0 10px 22px -10px rgba(15,23,42,0.55),
                  0 2px 0 rgba(255,255,255,0.04) inset;
    }
    .score-card img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      /* Most bank logos are dark on white. The tile is near-black, so
       invert so the logos read correctly inside the tile. */
      filter: invert(1) brightness(1.05);
    }

    /* Reduced motion: just fade in/out, no flip. */
    @media (prefers-reduced-motion: reduce) {
      .score-cell                { transition: opacity .3s ease; transform: none; }
      .score-cell.is-in,
      .score-cell.is-out          { animation: none; opacity: 1; transform: none; }
    }

    /* Arrows: circle buttons inside the scoreboard, same look as before. */
    .score-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(15,23,42,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0f172a;
      transition: background .15s ease, transform .15s ease;
      z-index: 2;
    }
    .score-arrow:hover  { background: #f8fafc; }
    .score-arrow:active { transform: translateY(-50%) scale(0.96); }
    .score-arrow.prev   { left: 8px; }
    .score-arrow.next   { right: 8px; }
    .score-arrow svg    { width: 16px; height: 16px; }

    /* Dots: 3 phase indicators under the tiles. */
    .score-dots {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    .score-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #cbd5e1;
      transition: background .2s ease, transform .2s ease;
    }
    .score-dot.active {
      background: #0f172a;
      transform: scale(1.25);
    }

    /* Slide 1 — Moneylizer logo animation.
       Entrance: soft scale-in + fade. Idle: very gentle breathing pulse
       and a halo glow that breathes with it. */
    .m360-logo-wrap {
      display: flex; align-items: center; justify-content: center;
    }
    .m360-logo-halo {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(560px, 70vw);
      height: min(560px, 70vw);
      border-radius: 9999px;
      background: radial-gradient(circle at center,
        rgba(248, 249, 252, 0.28) 0%,
        rgba(247, 248, 250, 0.14) 38%,
        rgba(16,185,129,0.08) 60%,
        transparent 78%);
      filter: blur(28px);
      animation: m360-halo 4.2s ease-in-out infinite;
      pointer-events: none;
    }
    .m360-logo {
      position: relative;
      opacity: 0;
      transform: scale(0.92);
      animation:
        m360-enter 0.9s cubic-bezier(.22,1,.36,1) 0.15s forwards,
        m360-breathe 4.2s ease-in-out 1.1s infinite;
      filter: drop-shadow(0 18px 38px rgba(15,23,42,0.55))
              drop-shadow(0 2px 0 rgba(255,255,255,0.04));
    }
    @keyframes m360-enter {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes m360-breathe {
      0%, 100% { transform: scale(1);    opacity: 1;    }
      50%      { transform: scale(1.035); opacity: 0.96; }
    }
    @keyframes m360-halo {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.08); opacity: 1;    }
    }

    /* ---------------------------------------------------------------------
       MOBILE FULLSCREEN PRESENTATION (below 768px)
       - Page fits 100vh: fixed header, hero fills the middle, fixed footer
       - No vertical scroll, no horizontal overflow
       - All 4 slides share the same height (= hero height)
       - object-fit: contain + white background; nothing is cropped
       - Every image / video is centered horizontally and vertically
       - Hero height = calc(100vh - headerHeight - footerHeight)
       - Desktop (>=768px) is untouched — rules are scoped to a max-width query
    --------------------------------------------------------------------- */
    @media (max-width: 767.98px) {
      /* Reset browser defaults that contribute to side gaps and scrolling */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        width: 100% !important;
        overflow: hidden !important;       /* no page-level scrolling */
        background: #FFFFFF !important;
      }

      /* Fixed header at the top of the mobile viewport (68px tall) */
      .site-nav {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 68px !important;
        margin: 0 !important;
        z-index: 50 !important;
      }

      /* Fixed footer at the bottom of the mobile viewport.
         Drop the desktop top margin so the footer hugs the bottom edge. */
      .site-footer {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        z-index: 50 !important;
        background: #FFFFFF !important;
      }

      /* main: fills the exact area between the fixed header and footer.
         height = calc(100vh - 68px header - 120px footer reservation).
         Using position:fixed with top/bottom anchors guarantees the hero
         touches both header and footer with no white gap. */
      main {
        position: fixed !important;
        top: 68px !important;
        bottom: 120px !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        background: #FFFFFF !important;
      }

      /* Hero section fills main exactly */
      #demo {
        position: relative !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        overflow: hidden !important;
      }
      #slideViewport {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        overflow: hidden !important;
      }

      /* Every slide: identical height = full hero, same flex centering */
      .hero-slide {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        background: #FFFFFF !important;
      }
      /* Default: only the active slide is shown. JS still toggles opacity. */
      .hero-slide[style*="opacity: 0"] {
        display: none !important;
      }
      .hero-slide[style*="opacity: 1"] {
        display: flex !important;
      }

      /* Slide 1 — logo animation: iframe fills the slide edge-to-edge,
         no cropping; the inner HTML handles its own layout + centering. */
      .hero-slide[data-slide="0"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="0"] > div.absolute.inset-0 {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
      }
      .hero-slide[data-slide="0"] #logoFrame {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        display: block !important;
      }

      /* Slide 2 — hero video: contain, no crop, centered */
      .hero-slide[data-slide="1"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="1"] video {
        position: relative !important;
        width: auto !important;
        height: auto !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
      }
      /* Hide the dark gradient overlay on mobile — no longer needed with white bg */
      .hero-slide[data-slide="1"] > div.absolute.inset-0[style*="linear-gradient"] {
        display: none !important;
      }

      /* Slide 3 — scoreboard flip: fill the slide edge-to-edge, slightly
         tighter padding on phones so 4+4+2 fits on small screens. */
      .hero-slide[data-slide="2"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="2"] .scoreboard {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        padding: 12px 14px !important;
      }
      .hero-slide[data-slide="2"] .scoreboard-grid {
        gap: 8px !important;
      }

      /* Slide 4 — 3D Financial Cube (iframe): fill the slide edge-to-edge,
         no padding around it; the cube's own internal canvas handles its
         own layout. */
      .hero-slide[data-slide="3"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="3"] > div.absolute.inset-0 {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
      }
      .hero-slide[data-slide="3"] #cubeFrame {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        display: block !important;
      }

      /* Carousel dots: sit just above the fixed footer */
      #demo > div.absolute.bottom-5 {
        bottom: 12px !important;
        left: 0 !important;
        right: 0 !important;
      }

      /* Slide 2 play/pause button: keep it above the footer */
      #playToggle {
        bottom: 20px !important;
        left: 12px !important;
      }
    }
  </style>
</head>

<body class="text-slate-900 antialiased overflow-x-hidden">
  <div class="ambient" aria-hidden="true">
    <div class="blue"></div>
    <div class="green"></div>
  </div>

  <div id="site-header"></div>

  <main>

    <section id="demo" class="relative w-full h-[calc(100vh-68px)] overflow-hidden bg-[#0b1426]">
      <div class="fade-up d2 absolute inset-0">

        <!-- slide viewport: full-bleed, fills the entire hero area -->
        <div id="slideViewport" class="relative w-full h-full overflow-hidden bg-[#0b1426]">

<!-- Slide 1: Moneylizer logo animation.
               Same lazy-load pattern as slide 4's cube: the iframe has
               data-src but no src, so assets/logo-animation.html is NOT
               fetched eagerly. The carousel's first visit triggers the
               mount via startLogoIframe(); warmupLogo() prefetches the
               bundle after window.load (and again on each idle frame after
               the carousel completes a full loop, so returning visitors
               don't wait). -->
          <div class="hero-slide absolute inset-0 overflow-hidden" data-slide="0" data-duration="5000"
            style="background: linear-gradient(135deg,#f1f2f4,#f5f6f8);">
            <div class="absolute inset-0">
              <iframe
                id="logoFrame"
                data-src="assets/logo-animation.html"
                title="Moneylizer logo animation"
                loading="lazy"
                style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#f1f2f4;display:block;"
              ></iframe>
            </div>
          </div>

          <!-- Slide 2: Product Demo (video) -->
          <div class="hero-slide absolute inset-0" data-slide="1" data-duration="video">
            <video id="demoVideo" class="w-full h-full object-cover" muted playsinline preload="auto"
              src="assets/Demo2.mp4"></video>
            <div class="absolute inset-0"
              style="background: linear-gradient(to top, rgba(7,18,36,0.4) 0%, transparent 55%);"></div>
            <button id="playToggle"
              class="absolute bottom-3 left-3 w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-md"
              aria-label="Pause demo">
              <svg id="pauseIcon" width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect x="8" y="6" width="3" height="12" rx="1" fill="#0f172a" />
                <rect x="13" y="6" width="3" height="12" rx="1" fill="#0f172a" />
              </svg>
              <svg id="playIcon" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M9 7.5v9l8-4.5-8-4.5Z" fill="#0f172a" />
              </svg>
            </button>
           
          </div>

          <!-- Slide 3: Scoreboard flip animation.
               10 logos laid out as 4 + 4 + 2. Each row of 4 flips in a
               90 ms-cascaded stagger; every 5 s the cycle advances to the
               next phase. Arrow buttons let the user step through manually
               (and reset the auto timer). The 3 dot indicators at the
               bottom show which phase is currently displayed. -->
          <div class="hero-slide absolute inset-0" data-slide="2" data-duration="15500" style="background:#ffffff;">
            <div class="scoreboard" id="scoreboard">
              <button class="score-arrow prev" id="scorePrev" aria-label="Previous phase" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>

              <div class="scoreboard-stage">
                <div class="scoreboard-grid" id="scoreGrid"></div>
              </div>

              <button class="score-arrow next" id="scoreNext" aria-label="Next phase" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>

              <div class="score-dots" id="scoreDots"></div>
            </div>
          </div>

<!-- Slide 4: 3D Financial Cube Animation.
               The cube is a self-contained page (assets/financial-cube.html)
               built from the standalone 3d-financial-cube-animation prototype.
               We mount it as an iframe so the heavy Three.js bundle is loaded
               only when this slide becomes visible, and stays isolated from
               the rest of the hero page. The cube URL lives in data-src so the
               iframe is NOT fetched eagerly on page load — first paint stays
               light. JS (startCubeIframe) copies data-src into src only when
               the carousel lands on slide 4, and a one-time <link rel=prefetch>
               (added in the warm-up hook below) speculatively fetches the
               bundle after window.load so it's ready when slide 4 shows. -->
          <div class="hero-slide absolute inset-0" data-slide="3" data-duration="12000" style="background:#ffffff;">
            <div class="absolute inset-0">
              <iframe
                id="cubeFrame"
                data-src="assets/financial-cube.html"
                title="Financial Analytics Cube"
                loading="lazy"
                style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#ffffff;display:block;"
                allow="autoplay; fullscreen"
              ></iframe>
            </div>
          </div>

        </div>
      </div>

      <!-- carousel dots -->
      <div class="absolute bottom-5 left-0 right-0 z-10 flex items-center justify-center gap-2">
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-900" data-i="0" aria-label="Slide 1"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="1" aria-label="Slide 2"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="2" aria-label="Slide 3"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="3" aria-label="Slide 4"></button>
      </div>
    </section>

  </main>

  <script>
    // ---------------------------------------------------------------------------
    // Hero carousel controller
    // - Slides 1, 3, 4: fixed 5s dwell
    // - Slide 2: dwell = duration of the video (pauses carousel until 'ended')
    // - Slide 4: internal tab switching does NOT advance the carousel
    // - Manual dot click resets the timer for the destination slide
    // - Mouse hover pauses the auto-advance; leave resumes it
    // ---------------------------------------------------------------------------
    (function () {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.hero-dot');
      const viewport = document.getElementById('slideViewport');
      const video = document.getElementById('demoVideo');
      const playToggle = document.getElementById('playToggle');
      const pauseIcon = document.getElementById('pauseIcon');
      const playIcon = document.getElementById('playIcon');

      const DEFAULT_DWELL = 5000; // ms — Slides 1, 3
      const CUBE_DWELL_MS = 12000; // ms — Slide 4 (cube is the whole show)
      const VIDEO_DWELL = 'video'; // sentinel for slide 2

      // ---- Slide 3: Scoreboard flip animation (4 → 4 → 2 logos).
      // Each phase shows up to 4 cards. Phase A: logos 1-4,
      // phase B: logos 5-8, phase C: logos 9-10 (only 2 in this row).
      // ---- Slide 3: Logo scoreboard (4 → 4 → 2 logos).
      // 10 black tiles (one logo each) arranged in 3 rows of 4-4-2.
      // Each phase plays a "flip-up from the bottom" entrance on its
      // 4 (or 2) tiles, left-to-right with a small per-cell delay. Tiles
      // hold for PHASE_DWELL_MS, then drop down before the next phase
      // flips up. Auto-advances every 5 s; arrow buttons / dot indicators
      // step phases manually and reset the auto timer. ----
      const SCORE_LOGOS = [
        { name: 'State Bank of India', logo: 'assets/banks/SBI.png' },
        { name: 'HDFC Bank',           logo: 'assets/banks/HDFC.jpg' },
        { name: 'Axis Bank',           logo: 'assets/banks/AXIS.png' },
        { name: 'ICICI Bank',          logo: 'assets/banks/ICICI.png' },
        { name: 'Google Pay',          logo: 'assets/banks/GPAY.jpg' },
        { name: 'PhonePe',             logo: 'assets/banks/phonepay.png' },
        { name: 'Samsung Wallet',      logo: 'assets/banks/Samati.png' },
        { name: 'Mutual Funds',        logo: 'assets/banks/MF.jpg' },
        { name: 'IndusInd Bank',       logo: 'assets/banks/Induslnd.png' },
        { name: 'BHIM UPI',            logo: 'assets/banks/Bhim.png' },
      ];

      const PHASES = [4, 4, 2];                 // tile counts per phase
      const PHASE_DWELL_MS    = 5000;           // hold before flipping to next phase
      const CARD_IN_STAGGER   = 90;             // delay between tiles within a row
      const CARD_OUT_STAGGER  = 50;             // faster cascade when tiles drop
      const CARD_IN_DURATION  = 850;            // matches CSS keyframe duration
      const CARD_OUT_DURATION = 450;            // matches CSS keyframe duration

      const scoreGrid = document.getElementById('scoreGrid');
      const scoreDots = document.getElementById('scoreDots');
      const scorePrev = document.getElementById('scorePrev');
      const scoreNext = document.getElementById('scoreNext');

      let scorePhase        = 0;
      let scoreTimer        = null;
      let scoreTimeout      = null;             // one-shot delay between exit and entrance
      let scoreCardsBuilt   = false;
      let scoreEntering     = false;           // debounce so two advances can't overlap

      function buildScoreCards() {
        if (!scoreGrid || scoreCardsBuilt) return;
        scoreGrid.innerHTML = SCORE_LOGOS.map((l, i) => `
          <div class="score-cell" data-idx="${i}" aria-hidden="true">
            <div class="score-card">
              <img src="${l.logo}" alt="${l.name}" loading="lazy" decoding="async">
            </div>
          </div>
        `).join('');
        scoreCardsBuilt = true;
      }

      function buildScoreDots() {
        if (!scoreDots) return;
        scoreDots.innerHTML = PHASES.map((_, i) =>
          `<span class="score-dot${i === scorePhase ? ' active' : ''}" data-phase="${i}"></span>`
        ).join('');
        scoreDots.querySelectorAll('.score-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            const target = parseInt(dot.dataset.phase, 10);
            if (target !== scorePhase) jumpToScore(target);
          });
        });
      }

      // Visible cards in a phase: phase A = [0..3], B = [4..7], C = [8..9].
      function visibleCardIndices(phase) {
        const start = PHASES.slice(0, phase).reduce((s, n) => s + n, 0);
        const count = PHASES[phase];
        return Array.from({ length: count }, (_, i) => start + i);
      }

      function setDots(phase) {
        if (!scoreDots) return;
        scoreDots.querySelectorAll('.score-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === phase);
        });
      }

      function setArrowDisabled(phase) {
        if (scorePrev) scorePrev.disabled = (phase === 0);
        if (scoreNext) scoreNext.disabled = (phase === PHASES.length - 1);
      }

      // Play the "drop down + fade out" animation on cells that belong to
      // the previous phase, and the "flip up from bottom" entrance on
      // cells that belong to the new phase. Per-cell --flip-delay drives
      // the cascade.
      function transitionTo(newPhase) {
        if (!scoreGrid) return;
        scoreEntering = true;
        const newVisible = new Set(visibleCardIndices(newPhase));

        scoreGrid.querySelectorAll('.score-cell').forEach(cell => {
          const idx = parseInt(cell.dataset.idx, 10);
          const wasVisible = !cell.classList.contains('is-idle') && !cell.classList.contains('is-out');

          // Cells leaving: play the exit animation.
          if (wasVisible && !newVisible.has(idx)) {
            const exitOrder = [...cell.parentElement.querySelectorAll('.score-cell')]
              .filter(c => !c.classList.contains('is-out') && !c.classList.contains('is-idle'))
              .indexOf(cell);
            cell.style.setProperty('--flip-delay', (exitOrder * CARD_OUT_STAGGER) + 'ms');
            cell.classList.remove('is-in');
            cell.classList.add('is-out');
            // After the exit animation finishes, hide it.
            setTimeout(() => {
              cell.classList.add('is-idle');
              cell.style.display = 'none';
            }, CARD_OUT_DURATION + exitOrder * CARD_OUT_STAGGER + 50);
            return;
          }

          // Cells staying: no-op.
          if (wasVisible && newVisible.has(idx)) return;

          // Cells entering: position them in the layout, set stagger, play in.
          if (!wasVisible && newVisible.has(idx)) {
            cell.style.display = '';
            cell.classList.remove('is-idle', 'is-out');
            const enterOrder = [...newVisible].indexOf(idx);
            cell.style.setProperty('--flip-delay', (enterOrder * CARD_IN_STAGGER) + 'ms');
            // Force reflow so the entrance animation re-triggers cleanly.
            void cell.offsetWidth;
            cell.classList.add('is-in');
          }
        });

        setDots(newPhase);
        setArrowDisabled(newPhase);

        // Unlock advanceScore once the entrance settles (longest stagger + duration).
        const maxStagger = (Math.max(...newVisible) - Math.min(...newVisible)) * CARD_IN_STAGGER;
        if (scoreTimeout) clearTimeout(scoreTimeout);
        scoreTimeout = setTimeout(() => {
          scoreEntering = false;
          scheduleNextAdvance();
        }, CARD_IN_DURATION + maxStagger + 50);
      }

      // Auto-tick callback: advance to next phase and schedule the next tick.
      function scheduleNextAdvance() {
        if (scoreTimer) { clearTimeout(scoreTimer); scoreTimer = null; }
        scoreTimer = setTimeout(advanceScore, PHASE_DWELL_MS);
      }
      function advanceScore() {
        if (scoreEntering) return;
        const next = (scorePhase + 1) % PHASES.length;
        scorePhase = next;
        transitionTo(next);
      }

      // Manual navigation (arrow / dot): jump to the given phase and restart
      // the dwell timer. Cancels any in-flight transition.
      function jumpToScore(phase) {
        if (scoreEntering) {
          // Force-finish the current entrance immediately by skipping its unlock.
          scoreEntering = false;
          if (scoreTimeout) { clearTimeout(scoreTimeout); scoreTimeout = null; }
        }
        scorePhase = phase;
        if (scoreTimer) { clearTimeout(scoreTimer); scoreTimer = null; }
        transitionTo(phase);
      }

      function startScoreCycle() {
        stopScoreCycle();
        if (!scoreCardsBuilt) buildScoreCards();
        if (!scoreDots || !scoreDots.children.length) buildScoreDots();
        // Reset every tile to idle.
        if (scoreGrid) {
          scoreGrid.querySelectorAll('.score-cell').forEach(cell => {
            cell.classList.remove('is-in', 'is-out');
            cell.classList.add('is-idle');
            cell.style.display = 'none';
          });
        }
        scorePhase = 0;
        // First phase entrance — no exit to play.
        scoreEntering = true;
        const firstVisible = visibleCardIndices(0);
        if (scoreGrid) {
          scoreGrid.querySelectorAll('.score-cell').forEach(cell => {
            const idx = parseInt(cell.dataset.idx, 10);
            if (firstVisible.includes(idx)) {
              cell.style.display = '';
              cell.classList.remove('is-idle');
              cell.style.setProperty('--flip-delay', (firstVisible.indexOf(idx) * CARD_IN_STAGGER) + 'ms');
              void cell.offsetWidth;
              cell.classList.add('is-in');
            }
          });
        }
        setDots(0);
        setArrowDisabled(0);
        // After the entrance plays, schedule the auto-advance.
        if (scoreTimeout) clearTimeout(scoreTimeout);
        scoreTimeout = setTimeout(() => {
          scoreEntering = false;
          scheduleNextAdvance();
        }, CARD_IN_DURATION + (firstVisible.length - 1) * CARD_IN_STAGGER + 50);
      }

      function stopScoreCycle() {
        if (scoreTimer)   { clearTimeout(scoreTimer);   scoreTimer   = null; }
        if (scoreTimeout) { clearTimeout(scoreTimeout); scoreTimeout = null; }
        scoreEntering = false;
        // Reset all tiles to idle so the next startScoreCycle is clean.
        if (scoreGrid) {
          scoreGrid.querySelectorAll('.score-cell').forEach(cell => {
            cell.classList.remove('is-in', 'is-out');
            cell.classList.add('is-idle');
            cell.style.display = 'none';
          });
        }
      }

      scorePrev && scorePrev.addEventListener('click', () => {
        if (scorePhase > 0) jumpToScore(scorePhase - 1);
      });
      scoreNext && scoreNext.addEventListener('click', () => {
        if (scorePhase < PHASES.length - 1) jumpToScore(scorePhase + 1);
      });

      let active = 0;
      let timer = null;
      let hovered = false;

      function setPlaying(p) {
        pauseIcon.classList.toggle('hidden', !p);
        playIcon.classList.toggle('hidden', p);
      }

      function dwellFor(slideEl) {
        if (!slideEl) return DEFAULT_DWELL;
        if (slideEl.dataset.duration === VIDEO_DWELL) return VIDEO_DWELL;
        // Numeric data-duration overrides DEFAULT_DWELL — used by slide 3
        // (scoreboard) so all 3 phases have time to play.
        const override = parseInt(slideEl.dataset.duration, 10);
        if (!isNaN(override) && override !== DEFAULT_DWELL) return override;
        return DEFAULT_DWELL;
      }

      function clearTimer() {
        if (timer) { clearTimeout(timer); timer = null; }
      }

      function scheduleAdvance() {
        clearTimer();
        if (hovered) return;
        if (active === 3) {
          // Slide 4: cube is the whole show. Hold for CUBE_DWELL_MS then loop.
          timer = setTimeout(() => goTo(0), CUBE_DWELL_MS);
          return;
        }
        const dwell = dwellFor(slides[active]);
        if (dwell === VIDEO_DWELL) {
          // Slide 2: do nothing — 'ended' event will move us forward
          return;
        }
        timer = setTimeout(() => goTo(active + 1), dwell);
      }

      function goTo(i, opts) {
        const manual = !!(opts && opts.manual);
        active = ((i % slides.length) + slides.length) % slides.length;

        slides.forEach((s, idx) => {
          s.style.opacity = idx === active ? '1' : '0';
          s.style.pointerEvents = idx === active ? 'auto' : 'none';
        });
        dots.forEach((d, idx) => {
          d.classList.toggle('bg-slate-900', idx === active);
          d.classList.toggle('bg-slate-300', idx !== active);
        });

        // Slide 2: video owns the timeline
        if (active === 1) {
          try { video.currentTime = 0; } catch (e) { /* metadata may not be ready yet */ }
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => { /* autoplay can be blocked until user interaction */ });
          }
        } else {
          // Leaving slide 2: stop/reset the video
          video.pause();
          try { video.currentTime = 0; } catch (e) { /* ignore */ }
        }

        // Slide 1: Moneylizer logo animation (lazy iframe).
        // First visit mounts it; subsequent visits cache-bust so the
        // letter-by-letter reveal replays.
        if (active === 0) {
          startLogoIframe();
        }

        // Slide 3: scoreboard flip (4-4-2). Auto-rotate on entry, stop
        // when leaving so the per-phase timer doesn't burn cycles in
        // the background.
        if (active === 2) {
          startScoreCycle();
        } else {
          stopScoreCycle();
        }

        // Slide 4: the 3D cube runs inside an iframe. Re-load it whenever
        // we land on this slide so its entrance animation replays from the
        // start (small, distant, then scales in). Leave it mounted otherwise.
        if (active === 3) {
          startCubeIframe();
        }

        if (manual) clearTimer();          // user-initiated jump cancels any pending tick
        scheduleAdvance();
      }

      // ---- dot (manual) navigation ----
      dots.forEach(d => d.addEventListener('click', () => {
        goTo(parseInt(d.dataset.i, 10), { manual: true });
      }));

      // ---- video controls (slide 2) ----
      playToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video.paused) video.play(); else video.pause();
      });
      video.addEventListener('play', () => setPlaying(true));
      video.addEventListener('pause', () => setPlaying(false));
      video.addEventListener('ended', () => {
        // Video finished — advance to slide 3
        if (active === 1) goTo(2);
      });

      // ---- hover pause/resume ----
      viewport.addEventListener('mouseenter', () => { hovered = true; clearTimer(); });
      viewport.addEventListener('mouseleave', () => { hovered = false; scheduleAdvance(); });

      // ---- slide 4: 3D Financial Cube (LAZY iframe).
      // The iframe has data-src but no src, so the browser does NOT fetch
      // assets/financial-cube.html on page load — first paint stays light.
      // startCubeIframe() copies data-src into src on the FIRST visit to
      // slide 4, then cache-busts on every subsequent visit so the cube's
      // entrance animation replays. After window.load fires, we also drop
      // in a <link rel=prefetch> so the cube downloads in the idle window
      // before the carousel naturally reaches slide 4 — by the time slide
      // 4 is shown, the bundle is already in the HTTP cache. ----
      const cubeFrame  = document.getElementById('cubeFrame');
      const CUBE_URL   = 'assets/financial-cube.html';
      let cubeMounted  = false;

      function startCubeIframe() {
        if (!cubeFrame) return;
        // Cache-bust on every entry — guarantees a clean Three.js /
        // R3F internal state and replays the entrance animation.
        const url = CUBE_URL + (cubeMounted ? '?t=' + Date.now() : '');
        cubeFrame.src = url;
        cubeMounted = true;
      }

      // ---- shared prefetch helper.
      // Cheap: only runs if the browser supports <link rel=prefetch> AND
      // we're not on a save-data / 2g connection. Safe to call multiple
      // times — same URL is deduped by the browser's HTTP cache. ----
      function prefetch(url) {
        try {
          const conn = navigator.connection || navigator.webkitConnection;
          if (conn && (conn.saveData || /(^|-)(2g|slow-2g)(-|$)/.test(conn.effectiveType || ''))) return;
          if (!('relList' in HTMLLinkElement.prototype)) return;
          if (!document.createElement('link').relList.supports('prefetch')) return;
          const link = document.createElement('link');
          link.rel  = 'prefetch';
          link.as   = 'document';
          link.href = url;
          document.head.appendChild(link);
        } catch (e) { /* ignore */ }
      }

      // ---- slide 1: Moneylizer logo animation (LAZY iframe). ----
      const logoFrame  = document.getElementById('logoFrame');
      const LOGO_URL   = 'assets/logo-animation.html';
      let logoMounted  = false;

      function startLogoIframe() {
        if (!logoFrame) return;
        // First visit: copy data-src into src. Later visits: cache-bust so
        // the letter-by-letter animation replays from the start.
        const url = LOGO_URL + (logoMounted ? '?t=' + Date.now() : '');
        logoFrame.src = url;
        logoMounted = true;
      }

      // ---- init ----
      slides.forEach(s => { s.style.transition = 'opacity .5s ease'; });
      goTo(0);
      // Both iframes are lazy — page load stays fast. After window.load
      // we speculatively prefetch the two bundles so they're cached before
      // the carousel naturally reaches slide 4 (cube) and on every
      // subsequent loop back to slide 1 (logo).
      function warmup() { prefetch(LOGO_URL); prefetch(CUBE_URL); }
      if (document.readyState === 'complete') warmup();
      else window.addEventListener('load', warmup, { once: true });
    })();
  </script>

  <div id="site-footer"></div>
  <script src="assets/partials.js"></script>
  <script src="assets/nav.js"></script>
</body>

</html>
