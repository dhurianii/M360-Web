<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moneylizer – 3D Cube</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  /* ─── Reset & Base ────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --accent3: #ff6b6b;
    --accent4: #ffd166;
    --face-bg: #f5f3ed;
    --face-border: #bbb5a8;
    --text: #29272f;
    --muted: #716e76;
    --size: 320px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ─── Scene ────────────────────────────────────────────────────── */
  #scene {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    perspective: 900px;
    perspective-origin: 50% 50%;
  }

  /* A soft ground shadow adds depth without any costly 3D lighting. */
  #cube-shadow {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--size) / 2 + 36px);
    width: var(--size);
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(45, 40, 34, 0.25) 0%, rgba(45, 40, 34, 0.1) 45%, transparent 72%);
    filter: blur(9px);
    transform: translateX(-50%) scaleX(1);
    transform-origin: center;
    animation: shadow-breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shadow-breathe {
    0%, 100% { opacity: 0.72; transform: translateX(-50%) scaleX(1); }
    50%      { opacity: 0.42; transform: translateX(-50%) scaleX(0.82); }
  }

  #float-wrap {
    animation: float 6s ease-in-out infinite;
    transform-style: preserve-3d;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-18px); }
  }

  /* ─── Cube ─────────────────────────────────────────────────────── */
  #cube {
    width:  var(--size);
    height: var(--size);
    transform-style: preserve-3d;
    /* auto-spin set via JS */
    cursor: grab;
    touch-action: none;
  }
  #cube.dragging { cursor: grabbing; }

  /* ─── Faces ────────────────────────────────────────────────────── */
  .face {
    position: absolute;
    width:  var(--size);
    height: var(--size);
    background: var(--face-bg);
    border: 1.5px solid var(--face-border);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    backface-visibility: hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      0 4px 12px rgba(48, 43, 34, 0.12),
      0 20px 48px rgba(48, 43, 34, 0.14);
  }

  .face-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* face transforms */
  .face-front  { transform: translateZ(calc(var(--size)/2)); }
  .face-back   { transform: rotateY(180deg) translateZ(calc(var(--size)/2)); }
  .face-right  { transform: rotateY(90deg)  translateZ(calc(var(--size)/2)); }
  .face-left   { transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); }
  .face-top    { transform: rotateX(90deg)  translateZ(calc(var(--size)/2)); }
  .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--size)/2)); }

  /* ─── Hint ─────────────────────────────────────────────────────── */
  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.08em;
    opacity: 0.7;
    pointer-events: none;
    white-space: nowrap;
  }

  #zoom-controls {
    position: fixed;
    right: 24px;
    bottom: 24px;
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  #zoom-controls button {
    width: 38px;
    height: 38px;
    border: 1px solid var(--face-border);
    border-radius: 50%;
    background: var(--face-bg);
    color: var(--text);
    font: 500 20px/1 system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(48, 43, 34, 0.1);
    transition: transform 160ms ease, background 160ms ease;
  }
  #zoom-controls button:hover { background: #ece9e1; transform: translateY(-2px); }
  #zoom-controls button:active { transform: scale(0.94); }

  /* ══════════════════════════════════════════════════════════════════
     GRAPH STYLES
  ══════════════════════════════════════════════════════════════════ */

  /* shared canvas wrapper */
  .chart-wrap {
    width: 100%; flex: 1;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .chart-wrap canvas {
    display: block;
    transform-origin: center;
    animation: graph-drift 4.8s ease-in-out infinite;
    will-change: transform;
  }
  #area-face canvas  { animation-delay: -1.2s; }
  #bar-face canvas   { animation-delay: -2.4s; }
  #line-face canvas  { animation-delay: -3.2s; }
  #radar-face canvas { animation-delay: -4s; }

  @keyframes graph-drift {
    0%, 100% { transform: translate3d(0, 2px, 0) scale(0.992); }
    50%      { transform: translate3d(0, -3px, 0) scale(1.012); }
  }

  /* ─── FACE 1 – SANKEY – faithful to reference image ──────────── */
  #sankey-face .sankey-img-wrap {
    width: 100%; flex: 1;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 15% 20%, #efebff 0%, transparent 42%),
      radial-gradient(110% 85% at 85% 80%, #eef5ff 0%, transparent 44%),
      linear-gradient(180deg, #fdfcff 0%, #f9f8ff 100%);
  }
  #sankey-face .sankey-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 10px;
  }
  /* shimmer pulse on the sankey image */
  #sankey-face .sankey-shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(
      105deg,
      transparent 40%,
      rgba(108,99,255,0.12) 50%,
      transparent 60%
    );
    background-size: 200% 100%;
    animation: shimmer 3.5s ease-in-out infinite;
    border-radius: 10px;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* sankey SVG fallback */
  #sankey-svg { width: 100%; height: 100%; }

  /* ─── Tooltip ──────────────────────────────────────────────────── */
  .chart-tooltip {
    position: fixed;
    background: rgba(245,243,237,0.96);
    border: 1px solid var(--face-border);
    color: var(--text);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    white-space: nowrap;
  }
  .chart-tooltip.visible { opacity: 1; }

  /* ─── Title tag ────────────────────────────────────────────────── */
  #title-tag {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #57535c;
    pointer-events: none;
  }
  #title-tag .t-icon {
    color: var(--accent);
    font-size: 16px;
    animation: icon-pulse 3s ease-in-out infinite;
  }
  @keyframes icon-pulse {
    0%,100% { opacity:0.7; transform: scale(1);   }
    50%      { opacity:1;   transform: scale(1.18); }
  }

  /* ─── BG ambient glow ──────────────────────────────────────────── */
  #bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    display: none;
  }

  /* ─── BG dot grid ───────────────────────────────────────────────── */
  #bg-grid {
    position: fixed; inset: 0; pointer-events: none;
    display: none;
  }

  /* ─── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 400px) {
    :root { --size: 240px; }
    #hint { bottom: 78px; }
    #zoom-controls { right: 50%; transform: translateX(50%); }
  }
  @media (min-width: 401px) and (max-width: 600px) {
    :root { --size: 280px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #cube-shadow, .chart-wrap canvas { animation: none; }
  }
</style>
</head>

<!-- Tooltip -->

<script>
/* ════════════════════════════════════════════════════════════════════
   CUBE CONTROLLER
   – CSS 3D transform based; zero external dependencies
   – Auto-rotate + float + drag + mouse parallax + wheel/pinch zoom
════════════════════════════════════════════════════════════════════ */
(function CubeController() {
  const cube = document.getElementById('cube');
  const floatWrap = document.getElementById('float-wrap');
  const scene = document.getElementById('scene');
  const zoomInButton = document.getElementById('zoom-in');
  const zoomOutButton = document.getElementById('zoom-out');

  let rotX = -20, rotY = 25;        // initial angle
  let velX = 0,   velY = 0;
  let isDragging = false;
  let isPinching = false;
  let lastX = 0,  lastY = 0;
  let autoSpin = true;
  let resumeTimer = null;
  let rafId;
  let parallaxX = 0, parallaxY = 0;
  let zoom = 1, targetZoom = 1;
  let pinchStartDistance = 0, pinchStartZoom = 1;

  const AUTO_SPEED = 0.12;          // deg/frame
  const FRICTION   = 0.92;
  const PARALLAX_STRENGTH = 6;      // deg max
  const MIN_ZOOM = 0.68;
  const MAX_ZOOM = 1.4;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clampZoom(value) {
    return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));
  }

  function setZoom(value) {
    targetZoom = clampZoom(value);
  }

  function applyTransform(now = performance.now()) {
    // A tiny automatic scale pulse keeps the cube alive without adding GPU-heavy effects.
    const breathe = reduceMotion ? 1 : 1 + Math.sin(now * 0.001) * 0.022;
    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${zoom * breathe})`;
  }

  function tick(now) {
    zoom += (targetZoom - zoom) * 0.12;

    if (!isDragging) {
      if (autoSpin) {
        rotY += AUTO_SPEED;
      } else {
        rotY += velY;
        rotX += velX;
        velX *= FRICTION;
        velY *= FRICTION;
      }
      // clamp X gently
      rotX = Math.max(-60, Math.min(60, rotX));
    }

    // apply parallax to float-wrap (subtle)
    floatWrap.style.transform =
      `rotateX(${parallaxY * PARALLAX_STRENGTH * 0.3}deg) rotateY(${parallaxX * PARALLAX_STRENGTH * 0.3}deg)`;

    applyTransform(now);
    rafId = requestAnimationFrame(tick);
  }

  // ── Mouse drag ──────────────────────────────────────────────────
  function onPointerDown(e) {
    isDragging = true;
    autoSpin   = false;
    cube.classList.add('dragging');
    lastX = e.clientX || e.touches?.[0]?.clientX || 0;
    lastY = e.clientY || e.touches?.[0]?.clientY || 0;
    velX = velY = 0;
    clearTimeout(resumeTimer);
  }

  function onPointerMove(e) {
    if (!isDragging) {
      // parallax from mouse position
      const nx = (e.clientX / window.innerWidth  - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      parallaxX += (nx - parallaxX) * 0.05;
      parallaxY += (ny - parallaxY) * 0.05;
      return;
    }
    const cx = e.clientX || e.touches?.[0]?.clientX || lastX;
    const cy = e.clientY || e.touches?.[0]?.clientY || lastY;
    const dx = cx - lastX;
    const dy = cy - lastY;
    velY = dx * 0.35;
    velX = -dy * 0.35;
    rotY += velY;
    rotX += velX;
    lastX = cx; lastY = cy;
    applyTransform();
  }

  function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;
    cube.classList.remove('dragging');
    resumeTimer = setTimeout(() => { autoSpin = true; velX = velY = 0; }, 2200);
  }

  function touchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  // Events
  cube.addEventListener('mousedown',   onPointerDown, { passive: true });
  window.addEventListener('mousemove', onPointerMove, { passive: true });
  window.addEventListener('mouseup',   onPointerUp);

  scene.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(targetZoom * Math.exp(-e.deltaY * 0.0012));
  }, { passive: false });

  zoomInButton.addEventListener('click', () => setZoom(targetZoom + 0.12));
  zoomOutButton.addEventListener('click', () => setZoom(targetZoom - 0.12));
  cube.addEventListener('dblclick', () => setZoom(1));

  cube.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      isPinching = true;
      isDragging = false;
      autoSpin = false;
      cube.classList.add('dragging');
      clearTimeout(resumeTimer);
      pinchStartDistance = touchDistance(e.touches);
      pinchStartZoom = targetZoom;
      return;
    }
    onPointerDown(e.touches[0]);
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (isPinching && e.touches.length >= 2) {
      e.preventDefault();
      setZoom(pinchStartZoom * (touchDistance(e.touches) / pinchStartDistance));
    } else if (isDragging && e.touches.length === 1) {
      e.preventDefault();
      onPointerMove(e.touches[0]);
    }
  }, { passive: false });
  window.addEventListener('touchend', e => {
    if (isPinching && e.touches.length < 2) {
      isPinching = false;
      cube.classList.remove('dragging');
      resumeTimer = setTimeout(() => { autoSpin = true; }, 1800);
      return;
    }
    onPointerUp();
  });

  tick();
})();


/* ════════════════════════════════════════════════════════════════════
   CHART UTILITIES
════════════════════════════════════════════════════════════════════ */
const C = {
  accent:  '#6c63ff',
  accent2: '#00d4aa',
  accent3: '#ff6b6b',
  accent4: '#ffd166',
  accent5: '#74b9ff',
  bg:      'rgba(245,243,237,0.0)',
  text:    '#29272f',
  muted:   '#716e76',
  grid:    'rgba(52,48,57,0.11)',
};

function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* animated progress 0→1 */
function animateDraw(duration, onFrame, onDone) {
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOut
    onFrame(ease);
    if (t < 1) requestAnimationFrame(step);
    else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}

/* ════════════════════════════════════════════════════════════════════
   FACE 2 – DONUT CHART
════════════════════════════════════════════════════════════════════ */
(function DonutChart() {
  const canvas = document.getElementById('donut-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const data = [
    { label: 'Stocks',  value: 42, color: C.accent  },
    { label: 'Crypto',  value: 18, color: C.accent3 },
    { label: 'Bonds',   value: 25, color: C.accent2 },
    { label: 'Cash',    value: 15, color: C.accent4 },
  ];
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx = W/2, cy = H/2 - 10;
  const outerR = Math.min(W,H)*0.36;
  const innerR = outerR * 0.56;
  const GAP = 0.025; // rad gap between slices

  let progress = 0;
  let hoveredIdx = -1;
  let pulseT = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    let startAngle = -Math.PI/2;
    const slices = data.map(d => {
      const sweep = (d.value/total) * Math.PI * 2 * p;
      return { ...d, startAngle, sweep };
      startAngle += sweep + GAP;
    });
    // recalc with gaps
    let angle = -Math.PI/2;
    slices.forEach((s,i) => {
      s.startAngle = angle;
      s.sweep = (data[i].value/total) * (Math.PI*2 - GAP*data.length) * p;
      angle += s.sweep + GAP;
    });

    slices.forEach((s, i) => {
      const hovered = i === hoveredIdx;
      const idlePulse = 1 + Math.sin(pulseT + i * 0.9) * 0.015;
      const pulse = idlePulse * (hovered ? 1 + Math.sin(pulseT) * 0.015 : 1);
      const oR = outerR * pulse + (hovered ? 8 : 0);
      const iR = innerR;

      // glow
      if (hovered) {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = s.color;
      }

      ctx.beginPath();
      ctx.arc(cx, cy, oR, s.startAngle, s.startAngle + s.sweep);
      ctx.arc(cx, cy, iR, s.startAngle + s.sweep, s.startAngle, true);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.globalAlpha = hovered ? 1 : 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (hovered) ctx.restore();
    });

    // center text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.text;
    ctx.font = `bold 22px system-ui`;
    ctx.fillText('$48.5K', cx, cy - 6);
    ctx.fillStyle = C.muted;
    ctx.font = `10px system-ui`;
    ctx.fillText('Total Portfolio', cx, cy + 14);

    // legend
    const legendY = cy + outerR + 14;
    const colW = W / data.length;
    data.forEach((d,i) => {
      const lx = colW * i + colW/2;
      ctx.fillStyle = d.color;
      ctx.fillRect(lx - 18, legendY, 10, 10);
      ctx.fillStyle = C.muted;
      ctx.font = '8.5px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(d.label, lx - 5, legendY + 8);
    });
  }

  // idle animation: gentle pulse on each slice
  function idleTick() {
    pulseT += 0.04;
    draw(1);
    requestAnimationFrame(idleTick);
  }

  animateDraw(1100, p => { progress = p; draw(p); }, idleTick);
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 3 – AREA CHART
════════════════════════════════════════════════════════════════════ */
(function AreaChart() {
  const canvas = document.getElementById('area-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const months  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const values  = [22.1, 23.5, 22.8, 25.2, 27.0, 26.4, 29.1, 31.5, 30.2, 33.8, 35.1, 38.4];
  const PAD = { t:20, r:14, b:28, l:38 };
  const W2 = W - PAD.l - PAD.r;
  const H2 = H - PAD.t - PAD.b;

  const minV = 20, maxV = 42;
  function px(i)  { return PAD.l + (i/(values.length-1))*W2; }
  function py(v)  { return PAD.t + H2 - ((v-minV)/(maxV-minV))*H2; }

  let shimX = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid lines
    [25,30,35,40].forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y);
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = C.muted; ctx.font = '8px system-ui';
      ctx.textAlign = 'right';
      ctx.fillText(`$${v}K`, PAD.l - 3, y + 3);
    });

    // build points up to progress
    const pts = [];
    const count = Math.max(2, Math.round(p * values.length));
    for (let i=0; i<count; i++) {
      const frac = Math.min(1, p * values.length - (i - 1));
      const v = i < count-1 ? values[i] : lerp(values[Math.max(0,i-1)], values[i], frac);
      pts.push([px(i), py(v)]);
    }

    if (pts.length < 2) return;

    // gradient fill
    const grad = ctx.createLinearGradient(0, PAD.t, 0, H - PAD.b);
    grad.addColorStop(0,   hexToRgba(C.accent, 0.45));
    grad.addColorStop(0.6, hexToRgba(C.accent, 0.12));
    grad.addColorStop(1,   hexToRgba(C.accent, 0.0));

    ctx.beginPath();
    ctx.moveTo(pts[0][0], H - PAD.b);
    ctx.lineTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length; i++) {
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      const cx0 = x0+(x1-x0)*0.5, cx1 = x1-(x1-x0)*0.5;
      ctx.bezierCurveTo(cx0, y0, cx1, y1, x1, y1);
    }
    ctx.lineTo(pts[pts.length-1][0], H - PAD.b);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line stroke
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length; i++) {
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      const cx0 = x0+(x1-x0)*0.5, cx1 = x1-(x1-x0)*0.5;
      ctx.bezierCurveTo(cx0, y0, cx1, y1, x1, y1);
    }
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();

    // dots
    pts.forEach(([x,y], i) => {
      ctx.beginPath();
      ctx.arc(x, y, 2.5 + Math.sin(shimX * 0.04 + i * 0.75) * 0.65, 0, Math.PI*2);
      ctx.fillStyle = C.accent; ctx.fill();
    });

    // shimmer line
    const sx = PAD.l + ((shimX % (W2 + 60)) - 30);
    const shimGrad = ctx.createLinearGradient(sx-15, 0, sx+15, 0);
    shimGrad.addColorStop(0,   'transparent');
    shimGrad.addColorStop(0.5, 'rgba(108,99,255,0.35)');
    shimGrad.addColorStop(1,   'transparent');
    ctx.fillStyle = shimGrad;
    ctx.fillRect(sx-15, PAD.t, 30, H2);

    // x labels
    ctx.fillStyle = C.muted; ctx.font = '7.5px system-ui'; ctx.textAlign = 'center';
    months.forEach((m,i) => {
      if (i % 2 === 0) ctx.fillText(m, px(i), H - 4);
    });
  }

  animateDraw(1200, p => draw(p), () => {
    function shimTick() {
      shimX += 1.5;
      draw(1);
      requestAnimationFrame(shimTick);
    }
    shimTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 4 – MULTI-BAR CHART
════════════════════════════════════════════════════════════════════ */
(function BarChart() {
  const canvas = document.getElementById('bar-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const cats    = ['Jan','Feb','Mar','Apr','May','Jun'];
  const income  = [5200, 5800, 5400, 6200, 6800, 7100];
  const expense = [3800, 4100, 3900, 4400, 4700, 4900];
  const PAD = { t:20, r:14, b:28, l:38 };
  const W2 = W - PAD.l - PAD.r;
  const H2 = H - PAD.t - PAD.b;
  const maxV = 8000;
  const groupW = W2 / cats.length;
  const barW   = groupW * 0.3;

  function py(v) { return PAD.t + H2 - (v/maxV)*H2; }
  function ph(v) { return (v/maxV)*H2; }

  let pulseT = 0;

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid
    [2000,4000,6000,8000].forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y);
      ctx.strokeStyle = C.grid; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=C.muted; ctx.font='8px system-ui'; ctx.textAlign='right';
      ctx.fillText(`$${v/1000}K`, PAD.l-3, y+3);
    });

    cats.forEach((cat,i) => {
      const gx = PAD.l + i*groupW + groupW*0.1;
      const pulse = 1 + Math.sin(pulseT + i*0.8)*0.026;

      // Income bar
      const ih = ph(income[i]*p) * pulse;
      const ig = ctx.createLinearGradient(0, py(income[i]*p), 0, py(0));
      ig.addColorStop(0, hexToRgba(C.accent2, 0.95));
      ig.addColorStop(1, hexToRgba(C.accent2, 0.5));
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.roundRect(gx, H-PAD.b - ih, barW, ih, [3,3,0,0]);
      ctx.fill();

      // Expense bar
      const eh = ph(expense[i]*p) * pulse;
      const eg = ctx.createLinearGradient(0, py(expense[i]*p), 0, py(0));
      eg.addColorStop(0, hexToRgba(C.accent3, 0.95));
      eg.addColorStop(1, hexToRgba(C.accent3, 0.5));
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.roundRect(gx + barW + 3, H-PAD.b - eh, barW, eh, [3,3,0,0]);
      ctx.fill();

      // label
      ctx.fillStyle = C.muted; ctx.font='8px system-ui'; ctx.textAlign='center';
      ctx.fillText(cat, gx + barW + 1.5, H - 6);
    });

    // legend
    ctx.fillStyle = C.accent2;
    ctx.fillRect(PAD.l, 5, 8, 8);
    ctx.fillStyle = C.muted; ctx.font='8px system-ui'; ctx.textAlign='left';
    ctx.fillText('Income', PAD.l+11, 13);
    ctx.fillStyle = C.accent3;
    ctx.fillRect(PAD.l+55, 5, 8, 8);
    ctx.fillStyle = C.muted;
    ctx.fillText('Expense', PAD.l+68, 13);
  }

  animateDraw(1100, p => draw(p), () => {
    function idleTick() {
      pulseT += 0.035;
      draw(1);
      requestAnimationFrame(idleTick);
    }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 5 – LINE CHART (multi-line)
════════════════════════════════════════════════════════════════════ */
(function LineChart() {
  const canvas = document.getElementById('line-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const weeks = ['W1','W2','W3','W4','W5','W6','W7','W8','W9','W10'];
  const rev   = [12.2,13.5,12.8,15.1,14.7,16.2,17.8,16.5,19.2,21.0];
  const prof  = [3.1, 3.8, 3.2, 4.5, 4.1, 5.0, 5.9, 5.2, 6.8, 7.5];
  const PAD   = { t:20, r:14, b:28, l:38 };
  const W2 = W-PAD.l-PAD.r, H2 = H-PAD.t-PAD.b;
  const minV=0, maxV=25;

  function px(i) { return PAD.l + (i/(weeks.length-1))*W2; }
  function py(v) { return PAD.t + H2 - ((v-minV)/(maxV-minV))*H2; }

  let dotT = 0;

  function drawLine(pts, color, dashed) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) {
      const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
      ctx.bezierCurveTo(x0+(x1-x0)*0.5,y0, x1-(x1-x0)*0.5,y1, x1,y1);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    if (dashed) {
      ctx.setLineDash([5,4]);
      ctx.lineDashOffset = -dotT * 7;
    } else {
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid
    [5,10,15,20,25].forEach(v => {
      const y = py(v);
      ctx.beginPath();
      ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y);
      ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=C.muted; ctx.font='8px system-ui'; ctx.textAlign='right';
      ctx.fillText(`$${v}K`,PAD.l-3,y+3);
    });

    const cnt = Math.max(2, Math.round(p*weeks.length));
    const revPts  = Array.from({length:cnt},(_,i)=>[px(i),py(rev[i])]);
    const profPts = Array.from({length:cnt},(_,i)=>[px(i),py(prof[i])]);

    drawLine(revPts,  C.accent,  false);
    drawLine(profPts, C.accent4, true);

    // animated dots on last point
    const rPulse = 3 + Math.sin(dotT)*1.2;
    const pPulse = 3 + Math.sin(dotT+1)*1.2;
    if (revPts.length) {
      const [rx,ry]=revPts[revPts.length-1];
      ctx.beginPath(); ctx.arc(rx,ry,rPulse,0,Math.PI*2);
      ctx.fillStyle=C.accent; ctx.fill();
      ctx.beginPath(); ctx.arc(rx,ry,rPulse+3,0,Math.PI*2);
      ctx.strokeStyle=hexToRgba(C.accent,0.3); ctx.lineWidth=1.5; ctx.stroke();
    }
    if (profPts.length) {
      const [px2,py2]=profPts[profPts.length-1];
      ctx.beginPath(); ctx.arc(px2,py2,pPulse,0,Math.PI*2);
      ctx.fillStyle=C.accent4; ctx.fill();
    }

    // labels
    ctx.fillStyle=C.muted; ctx.font='7.5px system-ui'; ctx.textAlign='center';
    weeks.forEach((w,i) => { if(i%2===0) ctx.fillText(w,px(i),H-4); });

    // legend
    ctx.fillStyle=C.accent; ctx.fillRect(PAD.l,5,12,3);
    ctx.fillStyle=C.muted;  ctx.font='8px system-ui'; ctx.textAlign='left';
    ctx.fillText('Revenue',PAD.l+15,13);
    ctx.strokeStyle=C.accent4; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l+65,7); ctx.lineTo(PAD.l+77,7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=C.muted; ctx.fillText('Profit',PAD.l+80,13);
  }

  animateDraw(1100, p => draw(p), () => {
    function idleTick() { dotT+=0.06; draw(1); requestAnimationFrame(idleTick); }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   FACE 6 – RADAR CHART
════════════════════════════════════════════════════════════════════ */
(function RadarChart() {
  const canvas = document.getElementById('radar-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const labels = ['Savings','Income','Invest','Debt','Spending','Emergency'];
  const scores = [82, 91, 68, 74, 58, 88];
  const cx = W/2, cy = H/2 + 4;
  const maxR = Math.min(W,H)*0.33;
  const N = labels.length;

  let pulseT = 0;

  function angle(i) { return (i/N)*Math.PI*2 - Math.PI/2; }
  function point(i, r) {
    return [cx + Math.cos(angle(i))*r, cy + Math.sin(angle(i))*r];
  }

  function draw(p) {
    ctx.clearRect(0,0,W,H);

    // grid rings
    [0.25,0.5,0.75,1].forEach(frac => {
      ctx.beginPath();
      for (let i=0;i<N;i++) {
        const [x,y]=point(i,maxR*frac);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // spokes
    for (let i=0;i<N;i++) {
      const [x,y]=point(i,maxR);
      ctx.beginPath();
      ctx.moveTo(cx,cy); ctx.lineTo(x,y);
      ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.stroke();
    }

    // data polygon with pulse
    const pulse = 1 + Math.sin(pulseT)*0.03;
    ctx.beginPath();
    for (let i=0;i<N;i++) {
      const r = (scores[i]/100)*maxR*p*pulse;
      const [x,y] = point(i,r);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,maxR);
    grad.addColorStop(0, hexToRgba(C.accent,0.6));
    grad.addColorStop(1, hexToRgba(C.accent2,0.25));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    // dots on vertices
    for (let i=0;i<N;i++) {
      const r = (scores[i]/100)*maxR*p*pulse;
      const [x,y] = point(i,r);
      ctx.beginPath();
      ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle = C.accent2; ctx.fill();
      ctx.strokeStyle='rgba(0,212,170,0.4)'; ctx.lineWidth=2; ctx.stroke();
    }

    // labels
    for (let i=0;i<N;i++) {
      const [x,y] = point(i, maxR+16);
      ctx.fillStyle = C.text;
      ctx.font = '8.5px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labels[i], x, y);
    }

    // center score
    const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length * p);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=C.text; ctx.font='bold 16px system-ui';
    ctx.fillText(avg, cx, cy-5);
    ctx.fillStyle=C.muted; ctx.font='8px system-ui';
    ctx.fillText('avg score', cx, cy+10);
  }

  animateDraw(1200, p => draw(p), () => {
    function idleTick() { pulseT+=0.04; draw(1); requestAnimationFrame(idleTick); }
    idleTick();
  });
})();


/* ════════════════════════════════════════════════════════════════════
   SANKEY – user image injection helper
   Call window.setSankeyImage('your-image-url') from console or parent page
════════════════════════════════════════════════════════════════════ */
window.setSankeyImage = function(url) {
  const wrap = document.getElementById('sankey-wrap');
  const svg  = document.getElementById('sankey-svg');
  if (svg) svg.remove();
  const img = document.createElement('img');
  img.src = url;
  img.alt = 'Sankey Diagram';
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:10px;';
  wrap.insertBefore(img, wrap.firstChild);
};
</script>
