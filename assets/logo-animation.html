<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneylizer - Animated Logo</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1b2f6e; --navy2:#12235c; }
  body{ font-family:'Poppins',system-ui,sans-serif; }

  /* ---------- Shield outline draw ---------- */
  .shield-outer{
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 1.5s cubic-bezier(.65,0,.35,1) forwards;
  }
  .shield-inner{
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: draw 1.4s .35s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .shield-fill{ opacity:0; animation: fadeIn .7s 1.1s forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---------- Bars ---------- */
  .bar{
    transform-origin: 50% 100%;
    transform: scaleY(0);
    opacity:0;
    animation: growBar .85s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  .bar.b1{ animation-delay:1.35s; }
  .bar.b2{ animation-delay:1.5s; }
  .bar.b3{ animation-delay:1.65s; }
  @keyframes growBar{ 0%{transform:scaleY(0);opacity:0} 20%{opacity:1} 100%{transform:scaleY(1);opacity:1} }

  /* pulse after settle */
  .logo-mark{ animation: floaty 5s 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* ---------- Word letters ---------- */
  .ltr{
    display:inline-block;
    opacity:0;
    transform: translateY(28px) rotate(6deg);
    animation: letterIn .6s cubic-bezier(.2,.9,.3,1.4) forwards;
  }
  @keyframes letterIn{ to{ opacity:1; transform:translateY(0) rotate(0); } }

  .tagline-line1{
    opacity:0; transform:translateY(12px);
    animation: letterIn .8s 2.5s forwards;
  }
  .tagline-line2{
    opacity:0; transform:translateY(12px);
    animation: letterIn .8s 2.65s forwards;
  }

  /* ---------- Shine sweep ---------- */
  .wordmark{ position:relative; overflow:hidden; }
  .wordmark::after{
    content:"";
    position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
    transform:skewX(-20deg);
    animation: shine 2.6s 2.7s ease-in-out infinite;
  }
  @keyframes shine{ 0%{left:-60%} 45%,100%{left:130%} }

  .stage.replay *{ animation:none !important; }

  .glow{ filter: drop-shadow(0 12px 30px rgba(27,47,110,.35)); }
  .grid-bg{
    background-image:radial-gradient(circle at 1px 1px, rgba(27,47,110,.16) 1px, transparent 0);
    background-size:26px 26px;
  }
</style>
</head>
<body class="min-h-screen grid-bg bg-white flex flex-col items-center justify-center p-6 overflow-x-hidden">

  <div id="stage" class="stage flex flex-col md:flex-row items-center gap-6 md:gap-12 select-none">

    <!-- MARK -->
    <svg class="logo-mark glow w-40 h-40 md:w-56 md:h-56" viewBox="0 0 200 240" fill="none">
      <defs>
        <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2a4494"/>
          <stop offset="100%" stop-color="#0e1c4d"/>
        </linearGradient>
        <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#0e9aa7"/><stop offset="100%" stop-color="#2ec5ce"/>
        </linearGradient>
        <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#2f4bd6"/><stop offset="100%" stop-color="#5b6ff0"/>
        </linearGradient>
        <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#5b21b6"/><stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <clipPath id="shieldInteriorClip">
          <path d="M100 34 L166 60 C166 136 141 182 100 208 C59 182 34 136 34 60 Z"/>
        </clipPath>
      </defs>

      <!-- filled shield body (fades in behind outline) -->
      <path class="shield-fill" d="M100 8 L188 42 C188 140 156 200 100 232 C44 200 12 140 12 42 Z" fill="url(#navyGrad)"/>
      <path class="shield-fill" d="M100 34 L166 60 C166 136 141 182 100 208 C59 182 34 136 34 60 Z" fill="#ffffff"/>

      <!-- bars are clipped to the shield interior, then scaled down + centered so they never touch the shield walls -->
      <g clip-path="url(#shieldInteriorClip)">
        <g transform="translate(100,121) scale(0.62) translate(-100,-121)">
          <rect class="bar b1" x="53"  y="112" width="26" height="66"  rx="12" fill="url(#bar1)"/>
          <rect class="bar b2" x="87"  y="78"  width="26" height="100" rx="12" fill="url(#bar2)"/>
          <rect class="bar b3" x="121" y="58"  width="26" height="120" rx="12" fill="url(#bar3)"/>
        </g>
      </g>

      <!-- outlines draw above the bars to keep the bars visually inside the shield -->
      <path class="shield-outer" d="M100 8 L188 42 C188 140 156 200 100 232 C44 200 12 140 12 42 Z"
            stroke="url(#navyGrad)" stroke-width="9" stroke-linejoin="round" fill="none"/>
      <path class="shield-inner" d="M100 34 L166 60 C166 136 141 182 100 208 C59 182 34 136 34 60 Z"
            stroke="#1b2f6e" stroke-width="5" stroke-linejoin="round" fill="none"/>
    </svg>

    <!-- WORDMARK -->
    <div class="text-center md:text-left">
      <h1 id="word" class="wordmark text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight text-[#1b2f6e]"></h1>
      <p class="tagline-line1 mt-2 text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight text-slate-800">Understand your money.</p>
      <p class="tagline-line2 mt-1 text-base md:text-2xl font-medium text-slate-800">Securely.</p>
    </div>
  </div>

<script>
const word = "Moneylizer";
const el = document.getElementById('word');

function buildLetters(){
  el.innerHTML = "";
  [...word].forEach((c,i)=>{
    const s = document.createElement('span');
    s.className = 'ltr';
    s.textContent = c;
    s.style.animationDelay = (1.75 + i*0.07) + 's';
    el.appendChild(s);
  });
}
  buildLetters();
</script>
</body>
</html>
