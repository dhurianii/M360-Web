<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moneylizer: Money Analyzer </title>
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest/site.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/android-chrome-512x512.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    /* carousel-only additions — kept here so style.css and the rest of the site stay untouched */
    /* Slide 3 — logo carousel */
    .logo-carousel {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center;
      padding: 12px 14px;           /* tighter padding on mobile */
      box-sizing: border-box;
      background: #ffffff;
    }
    @media (min-width: 640px) {
      .logo-carousel { padding: 16px 56px; }   /* room for circular arrows on tablet+ */
    }
    .logo-viewport {
      position: relative;
      flex: 1; height: 100%;
      overflow: hidden;
      /* peek of the next card on the right edge — signals "more content" */
      padding-right: 0;
    }
    @media (min-width: 640px) {
      .logo-viewport { padding-right: 40px; }
    }
    .logo-viewport::after {
      /* soft fade so the peeked card blends into the background */
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 30px;
      background: linear-gradient(to right, rgba(255,255,255,0), #ffffff 80%);
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .logo-viewport::after { width: 40px; }
    }
    .logo-track {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: 25%;      /* overridden by JS to (100/totalCols)% */
      gap: 0;                      /* visual spacing comes from card padding */
      height: 100%;
      width: 100%;                  /* overridden by JS */
      transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .logo-card {
      padding: 6px;
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      min-height: 0;
    }
    @media (min-width: 640px) {
      .logo-card { padding: 8px; }
    }
    .logo-card-inner {
      width: 100%; height: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;            /* subtle border */
      border-radius: 10px;                  /* rounded corners */
      box-shadow: 0 2px 8px rgba(15,23,42,0.06);  /* soft shadow */
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    @media (min-width: 640px) {
      .logo-card-inner { border-radius: 12px; padding: 14px; }
    }
    .logo-card-inner:hover {
      border-color: #c7d7f5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15,23,42,0.08);
    }
    .logo-card-inner svg,
    .logo-card-inner .logo-img {
      max-width: 80%; max-height: 80%;
      width: auto; height: auto;
    }
    .logo-card-inner .logo-img {
      object-fit: contain;
    }
    /* Arrows: inside the carousel on mobile (no side padding), outside on tablet+ */
    .logo-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px;
      border-radius: 9999px;        /* circle */
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(15,23,42,0.10);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #0f172a;
      transition: background .15s ease, transform .15s ease, opacity .2s ease;
      z-index: 2;
    }
    @media (min-width: 640px) {
      .logo-arrow { width: 38px; height: 38px; }
    }
    .logo-arrow:hover { background: #f8fafc; }
    .logo-arrow:active { transform: translateY(-50%) scale(0.96); }
    .logo-arrow:disabled { opacity: 0.35; cursor: default; }
    .logo-arrow.prev { left: 4px; }
    .logo-arrow.next { right: 4px; }
    @media (min-width: 640px) {
      .logo-arrow.prev { left: 8px; }
      .logo-arrow.next { right: 8px; }
    }
    .logo-arrow svg { width: 14px; height: 14px; }
    @media (min-width: 640px) {
      .logo-arrow svg { width: 16px; height: 16px; }
    }
    .viz-tab {
      font-size: 12px; font-weight: 600; color: #64748b;
      padding: 6px 12px; border-radius: 9999px;
      background: transparent; border: 1px solid transparent;
      cursor: pointer; transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .viz-tab:hover { color: #0f172a; }
    .viz-tab.active {
      color: #0f172a;
      background: #ffffff;
      border-color: #c7d7f5;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }

    /* ---------------------------------------------------------------------
       Slide 3 — Supported Statement Sources (4-row category panel).
       The whole slide is rendered inside assets/slide3-sources.html and
       mounted as an iframe so the rest of the page stays untouched. The
       iframe fills the slide edge-to-edge; the inner page owns its own
       typography, colour and layout.
    --------------------------------------------------------------------- */
    .sources-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      display: block;
    }

    /* Slide 1 — Moneylizer logo animation.
       Entrance: soft scale-in + fade. Idle: very gentle breathing pulse
       and a halo glow that breathes with it. */
    .m360-logo-wrap {
      display: flex; align-items: center; justify-content: center;
    }
    .m360-logo-halo {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(560px, 70vw);
      height: min(560px, 70vw);
      border-radius: 9999px;
      background: radial-gradient(circle at center,
        rgba(248, 249, 252, 0.28) 0%,
        rgba(247, 248, 250, 0.14) 38%,
        rgba(16,185,129,0.08) 60%,
        transparent 78%);
      filter: blur(28px);
      animation: m360-halo 4.2s ease-in-out infinite;
      pointer-events: none;
    }
    .m360-logo {
      position: relative;
      opacity: 0;
      transform: scale(0.92);
      animation:
        m360-enter 0.9s cubic-bezier(.22,1,.36,1) 0.15s forwards,
        m360-breathe 4.2s ease-in-out 1.1s infinite;
      filter: drop-shadow(0 18px 38px rgba(22, 34, 70, 0.55))
              drop-shadow(0 2px 0 rgba(255,255,255,0.04));
    }
    @keyframes m360-enter {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes m360-breathe {
      0%, 100% { transform: scale(1);    opacity: 1;    }
      50%      { transform: scale(1.035); opacity: 0.96; }
    }
    @keyframes m360-halo {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.08); opacity: 1;    }
    }

    /* ---------------------------------------------------------------------
       MOBILE FULLSCREEN PRESENTATION (below 768px)
       - Page fits 100vh: fixed header, hero fills the middle, fixed footer
       - No vertical scroll, no horizontal overflow
       - All 4 slides share the same height (= hero height)
       - object-fit: contain + white background; nothing is cropped
       - Every image / video is centered horizontally and vertically
       - Hero height = calc(100vh - headerHeight - footerHeight)
       - Desktop (>=768px) is untouched — rules are scoped to a max-width query
    --------------------------------------------------------------------- */
    @media (max-width: 767.98px) {
      /* Reset browser defaults that contribute to side gaps and scrolling */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        width: 100% !important;
        overflow: hidden !important;       /* no page-level scrolling */
        background: #FFFFFF !important;
      }

      /* Fixed header at the top of the mobile viewport (68px tall) */
      .site-nav {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 68px !important;
        margin: 0 !important;
        z-index: 50 !important;
      }

      /* Fixed footer at the bottom of the mobile viewport.
         Drop the desktop top margin so the footer hugs the bottom edge. */
      .site-footer {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        z-index: 50 !important;
        background: #FFFFFF !important;
      }

      /* main: fills the exact area between the fixed header and footer.
         height = calc(100vh - 68px header - 120px footer reservation).
         Using position:fixed with top/bottom anchors guarantees the hero
         touches both header and footer with no white gap. */
      main {
        position: fixed !important;
        top: 68px !important;
        bottom: 120px !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        background: #FFFFFF !important;
      }

      /* Hero section fills main exactly */
      #demo {
        position: relative !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        overflow: hidden !important;
      }
      #slideViewport {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        overflow: hidden !important;
      }

      /* Every slide: identical height = full hero, same flex centering */
      .hero-slide {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        background: #FFFFFF !important;
      }
      /* Default: only the active slide is shown. JS still toggles opacity. */
      .hero-slide[style*="opacity: 0"] {
        display: none !important;
      }
      .hero-slide[style*="opacity: 1"] {
        display: flex !important;
      }

      /* Slide 1 — first-slide video: contain, no crop, centered */
      .hero-slide[data-slide="0"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="0"] video {
        position: relative !important;
        width: auto !important;
        height: auto !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
      }
      /* Hide the dark gradient overlay on mobile — no longer needed with white bg */
      .hero-slide[data-slide="0"] > div.absolute.inset-0[style*="linear-gradient"] {
        display: none !important;
      }

      /* Slide 2 — hero video: contain, no crop, centered */
      .hero-slide[data-slide="1"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="1"] video {
        position: relative !important;
        width: auto !important;
        height: auto !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
      }
      /* Hide the dark gradient overlay on mobile — no longer needed with white bg */
      .hero-slide[data-slide="1"] > div.absolute.inset-0[style*="linear-gradient"] {
        display: none !important;
      }

      /* Slide 3 — supported sources iframe: fills the slide edge-to-edge.
         The inner page (slide3-sources.html) handles its own padding for
         small screens via its own @media queries. */
      .hero-slide[data-slide="2"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="2"] > div.absolute.inset-0 {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
      }
      .hero-slide[data-slide="2"] #sourcesFrame {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        display: block !important;
      }

      /* Slide 4 — 3D Financial Cube (iframe): fill the slide edge-to-edge,
         no padding around it; the cube's own internal canvas handles its
         own layout. */
      .hero-slide[data-slide="3"] {
        background: #FFFFFF !important;
      }
      .hero-slide[data-slide="3"] > div.absolute.inset-0 {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
      }
      .hero-slide[data-slide="3"] #cubeFrame {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        display: block !important;
      }

      /* Carousel dots: sit just above the fixed footer */
      #demo > div.absolute.bottom-5 {
        bottom: 12px !important;
        left: 0 !important;
        right: 0 !important;
      }

      /* Slide 2 play/pause button: keep it above the footer */
      #playToggle {
        bottom: 20px !important;
        left: 12px !important;
      }
    }
  </style>
</head>

<body class="text-slate-900 antialiased overflow-x-hidden">
  <div class="ambient" aria-hidden="true">
    <div class="blue"></div>
    <div class="green"></div>
  </div>

  <div id="site-header"></div>

  <main>

    <section id="demo" class="relative w-full h-[calc(100vh-68px)] overflow-hidden bg-[#0b1426]">
      <div class="fade-up d2 absolute inset-0">

        <!-- slide viewport: full-bleed, fills the entire hero area -->
        <div id="slideViewport" class="relative w-full h-full overflow-hidden bg-[#0b1426]">

<!-- Slide 1: Moneylizer intro video (assets/first-slide.mp4).
               The <video> element is loaded eagerly so it starts as soon as
               the carousel lands on slide 1. The video itself owns the
               timeline — when it 'ended' fires, the carousel advances to
               slide 2. -->
          <div class="hero-slide absolute inset-0" data-slide="0" data-duration="video"
            style="background:#ffffff;">
            <video id="firstSlideVideo" class="w-full h-full object-cover" muted playsinline preload="auto"
              src="assets/video/first-slide.mp4"></video>
            <div class="absolute inset-0"
              style="background: linear-gradient(to top, rgba(7,18,36,0.4) 0%, transparent 55%);"></div>
          </div>

          <!-- Slide 2: Product Demo (video) -->
          <div class="hero-slide absolute inset-0" data-slide="1" data-duration="video">
            <video id="demoVideo" class="w-full h-full object-cover" muted playsinline preload="auto"
              src="assets/video/demo.mp4"></video>
            <div class="absolute inset-0"
              style="background: linear-gradient(to top, rgba(7,18,36,0.4) 0%, transparent 55%);"></div>
            <button id="playToggle"
              class="absolute bottom-3 left-3 w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-md"
              aria-label="Pause demo">
              <svg id="pauseIcon" width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect x="8" y="6" width="3" height="12" rx="1" fill="#0f172a" />
                <rect x="13" y="6" width="3" height="12" rx="1" fill="#0f172a" />
              </svg>
              <svg id="playIcon" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M9 7.5v9l8-4.5-8-4.5Z" fill="#0f172a" />
              </svg>
            </button>
           
          </div>

          <!-- Slide 3: Supported Statement Sources.
               4 full-width rows (Credit Cards / Savings A/C / UPI Wallets /
               Mutual Funds). Each row has a tinted left category panel and
               a responsive right-side logo grid. Renders inside
               assets/slide3-sources.html so the rest of the page stays
               untouched. Mounted as an iframe — data-src only, so the
               bundle is fetched lazily on first visit and warmed up via
               <link rel=prefetch> after window.load. -->
          <div class="hero-slide absolute inset-0" data-slide="2" data-duration="9000" style="background:#ffffff;">
            <div class="absolute inset-0">
              <iframe
                id="sourcesFrame"
                data-src="assets/content/sources.html"
                title="Supported Statement Sources"
                loading="lazy"
                class="sources-iframe"
                allow="autoplay"
              ></iframe>
            </div>
          </div>

<!-- Slide 4: 3D Financial Cube Animation.
               The cube is a self-contained page (assets/lightweight-cube.html)
               — a CSS-3D cube with canvas-rendered charts on each face. We
               mount it as an iframe so the bundle is loaded only when this
               slide becomes visible, and stays isolated from the rest of
               the hero page. The cube URL lives in data-src so the iframe
               is NOT fetched eagerly on page load — first paint stays
               light. JS (startCubeIframe) copies data-src into src only
               when the carousel lands on slide 4, and a one-time
               <link rel=prefetch> (added in the warm-up hook below)
               speculatively fetches the bundle after window.load so it's
               ready when slide 4 shows. -->
          <div class="hero-slide absolute inset-0" data-slide="3" data-duration="12000" style="background:#ffffff;">
            <div class="absolute inset-0">
              <iframe
                id="cubeFrame"
                data-src="assets/content/cube.html"
                title="Financial Analytics Cube"
                loading="lazy"
                style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#ffffff;display:block;"
                allow="autoplay; fullscreen"
              ></iframe>
            </div>
          </div>

        </div>
      </div>

      <!-- carousel dots -->
      <div class="absolute bottom-5 left-0 right-0 z-10 flex items-center justify-center gap-2">
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-900" data-i="0" aria-label="Slide 1"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="1" aria-label="Slide 2"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="2" aria-label="Slide 3"></button>
        <button class="hero-dot w-[7px] h-[7px] rounded-full bg-slate-300" data-i="3" aria-label="Slide 4"></button>
      </div>
    </section>

  </main>

  <script>
    // ---------------------------------------------------------------------------
    // Hero carousel controller
    // - Slides 1, 3, 4: fixed 5s dwell
    // - Slide 2: dwell = duration of the video (pauses carousel until 'ended')
    // - Slide 4: internal tab switching does NOT advance the carousel
    // - Manual dot click resets the timer for the destination slide
    // - Mouse hover pauses the auto-advance; leave resumes it
    // ---------------------------------------------------------------------------
    (function () {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.hero-dot');
      const viewport = document.getElementById('slideViewport');
      const video = document.getElementById('demoVideo');
      const firstSlideVideo = document.getElementById('firstSlideVideo');
      const playToggle = document.getElementById('playToggle');
      const pauseIcon = document.getElementById('pauseIcon');
      const playIcon = document.getElementById('playIcon');

      const DEFAULT_DWELL = 5000; // ms — Slides 1, 3
      const CUBE_DWELL_MS = 12000; // ms — Slide 4 (cube is the whole show)
      const VIDEO_DWELL = 'video'; // sentinel for slide 2

      // ---- Slide 3: Supported Statement Sources (lazy iframe).
      // The 4-row category panel is its own page (assets/slide3-sources.html),
      // so we only mount the iframe on first visit and never reload it —
      // the inner page has no entry animation, just a static grid + hover.
      const SOURCES_URL = 'assets/content/sources.html';

      let active = 0;
      let timer = null;
      let hovered = false;

      function setPlaying(p) {
        pauseIcon.classList.toggle('hidden', !p);
        playIcon.classList.toggle('hidden', p);
      }

      function dwellFor(slideEl) {
        if (!slideEl) return DEFAULT_DWELL;
        if (slideEl.dataset.duration === VIDEO_DWELL) return VIDEO_DWELL;
        // Numeric data-duration overrides DEFAULT_DWELL — used by slide 3
        // (sources) so it has time to read the 4 rows.
        const override = parseInt(slideEl.dataset.duration, 10);
        if (!isNaN(override) && override !== DEFAULT_DWELL) return override;
        return DEFAULT_DWELL;
      }

      function clearTimer() {
        if (timer) { clearTimeout(timer); timer = null; }
      }

      function scheduleAdvance() {
        clearTimer();
        if (hovered) return;
        if (active === 3) {
          // Slide 4: cube is the whole show. Hold for CUBE_DWELL_MS then loop.
          timer = setTimeout(() => goTo(0), CUBE_DWELL_MS);
          return;
        }
        const dwell = dwellFor(slides[active]);
        if (dwell === VIDEO_DWELL) {
          // Slide 2: do nothing — 'ended' event will move us forward
          return;
        }
        timer = setTimeout(() => goTo(active + 1), dwell);
      }

      function goTo(i, opts) {
        const manual = !!(opts && opts.manual);
        active = ((i % slides.length) + slides.length) % slides.length;

        slides.forEach((s, idx) => {
          s.style.opacity = idx === active ? '1' : '0';
          s.style.pointerEvents = idx === active ? 'auto' : 'none';
        });
        dots.forEach((d, idx) => {
          d.classList.toggle('bg-slate-900', idx === active);
          d.classList.toggle('bg-slate-300', idx !== active);
        });

        // Slide 1: first-slide video owns the timeline
        if (active === 0) {
          try { firstSlideVideo.currentTime = 0; } catch (e) { /* metadata may not be ready yet */ }
          const fsPlay = firstSlideVideo.play();
          if (fsPlay && typeof fsPlay.catch === 'function') {
            fsPlay.catch(() => { /* autoplay can be blocked until user interaction */ });
          }
        } else {
          // Leaving slide 1: stop/reset the video
          firstSlideVideo.pause();
          try { firstSlideVideo.currentTime = 0; } catch (e) { /* ignore */ }
        }

        // Slide 2: video owns the timeline
        if (active === 1) {
          try { video.currentTime = 0; } catch (e) { /* metadata may not be ready yet */ }
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => { /* autoplay can be blocked until user interaction */ });
          }
        } else {
          // Leaving slide 2: stop/reset the video
          video.pause();
          try { video.currentTime = 0; } catch (e) { /* ignore */ }
        }

        // (Slide 1 video handles its own entrance — no iframe to mount.)

        // Slide 3: mount the supported-sources iframe on first visit.
        if (active === 2) {
          startSourcesIframe();
        }

        // Slide 4: the 3D cube runs inside an iframe. Re-load it whenever
        // we land on this slide so its entrance animation replays from the
        // start (small, distant, then scales in). Leave it mounted otherwise.
        if (active === 3) {
          startCubeIframe();
        }

        if (manual) clearTimer();          // user-initiated jump cancels any pending tick
        scheduleAdvance();
      }

      // ---- dot (manual) navigation ----
      dots.forEach(d => d.addEventListener('click', () => {
        goTo(parseInt(d.dataset.i, 10), { manual: true });
      }));

      // ---- video controls (slide 2) ----
      playToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video.paused) video.play(); else video.pause();
      });
      video.addEventListener('play', () => setPlaying(true));
      video.addEventListener('pause', () => setPlaying(false));
      video.addEventListener('ended', () => {
        // Video finished — advance to slide 3
        if (active === 1) goTo(2);
      });

      // Slide 1 video owns its timeline too — advance to slide 2 when it ends
      firstSlideVideo.addEventListener('ended', () => {
        if (active === 0) goTo(1);
      });

      // ---- hover pause/resume ----
      viewport.addEventListener('mouseenter', () => { hovered = true; clearTimer(); });
      viewport.addEventListener('mouseleave', () => { hovered = false; scheduleAdvance(); });

      // ---- slide 4: 3D Financial Cube (LAZY iframe).
      // The iframe has data-src but no src, so the browser does NOT fetch
      // assets/lightweight-cube.html on page load — first paint stays light.
      // startCubeIframe() copies data-src into src on the FIRST visit to
      // slide 4 and NEVER re-loads. The cube bundle is heavy enough that
      // re-downloading on every carousel loop would be wasteful, and the
      // entrance animation doesn't carry the slide — the auto-rotate
      // inside the cube is the "alive" signal. After window.load fires we
      // also drop in a <link rel=prefetch> so the cube downloads in the
      // idle window before the carousel naturally reaches slide 4. ----
      const cubeFrame  = document.getElementById('cubeFrame');
      const CUBE_URL   = 'assets/content/cube.html';

      function startCubeIframe() {
        if (!cubeFrame || cubeFrame.src) return;
        cubeFrame.src = CUBE_URL;
      }

      // ---- shared prefetch helper.
      // Cheap: only runs if the browser supports <link rel=prefetch> AND
      // we're not on a save-data / 2g connection. Safe to call multiple
      // times — same URL is deduped by the browser's HTTP cache. ----
      function prefetch(url) {
        try {
          const conn = navigator.connection || navigator.webkitConnection;
          if (conn && (conn.saveData || /(^|-)(2g|slow-2g)(-|$)/.test(conn.effectiveType || ''))) return;
          if (!('relList' in HTMLLinkElement.prototype)) return;
          if (!document.createElement('link').relList.supports('prefetch')) return;
          const link = document.createElement('link');
          link.rel  = 'prefetch';
          link.as   = 'document';
          link.href = url;
          document.head.appendChild(link);
        } catch (e) { /* ignore */ }
      }

      // ---- slide 3: Supported Statement Sources (LAZY iframe). ----
      const sourcesFrame = document.getElementById('sourcesFrame');

      function startSourcesIframe() {
        if (!sourcesFrame || sourcesFrame.src) return;
        sourcesFrame.src = SOURCES_URL;
      }

      // ---- init ----
      slides.forEach(s => { s.style.transition = 'opacity .5s ease'; });
      goTo(0);
      // The remaining iframe (sources) is lazy — page load stays fast.
      // After window.load we speculatively prefetch its bundle so it's
      // cached before the carousel naturally reaches slide 3.
      function warmup() { prefetch(SOURCES_URL); prefetch(CUBE_URL); }
      if (document.readyState === 'complete') warmup();
      else window.addEventListener('load', warmup, { once: true });
    })();
  </script>

  <div id="site-footer"></div>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/nav.js"></script>
</body>
